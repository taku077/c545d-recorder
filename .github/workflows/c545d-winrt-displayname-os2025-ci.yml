name: C545D independent WinRT DisplayName Windows-2025 getter retention check

on:
  push:
    branches: ['investigate/c545d-last-residual-slope-20261120']
    paths:
      - '.github/workflows/c545d-winrt-displayname-os2025-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  winrt-os2025:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile same independent WinRT getter-only reproducer as Windows-2022 baseline
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $version=[System.Environment]::OSVersion.Version
          "C545D_WINRT_OS2025,os_major=$($version.Major),minor=$($version.Minor),build=$($version.Build),revision=$($version.Revision)" |
            Tee-Object -FilePath artifacts/os_build.txt
          & cl.exe /nologo /std:c++17 /EHsc /W4 /MD /O2 tests/winrt_displayname_direct_repro.cpp /Fe:artifacts/winrt_direct.exe /link windowsapp.lib runtimeobject.lib psapi.lib
          if ($LASTEXITCODE -ne 0) { throw 'Direct WinRT getter reproducer compile failed' }
      - name: Paired direct getter 128-cycle ID-only control versus DisplayName
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=(Resolve-Path artifacts/winrt_direct.exe).Path
          & $exe control > artifacts/winrt_control.txt
          if ($LASTEXITCODE -ne 0) { throw 'Control WinRT ID-only probe failed' }
          & $exe display > artifacts/winrt_display.txt
          if ($LASTEXITCODE -ne 0) { throw 'DisplayName WinRT getter probe failed' }
          py tests/analyze_winrt_displayname_direct.py
          if ($LASTEXITCODE -ne 0) { throw 'Getter paired comparison analyzer failed' }
          Get-Content artifacts/winrt_direct_comparison.csv
          "C545D_WINRT_OS2025_DIAGNOSTIC_COMPLETE; NO_GLIB_OR_GSTREAMER; NOT_WIN10_HOST_PROOF"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c545d-winrt-direct-os2025-numeric-only
          path: |
            artifacts/os_build.txt
            artifacts/winrt_control.txt
            artifacts/winrt_display.txt
            artifacts/winrt_direct_comparison.csv
          retention-days: 7
          if-no-files-found: warn
