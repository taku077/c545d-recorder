name: C545D isolated Windows UST/UMDH allocation-stack toolchain preflight (CI ONLY)
on:
  push:
    branches: ['investigate/c545d-status-only-monitor-20261120']
    paths:
      - 'tests/c545d_umdh_stack_preflight.c'
      - '.github/workflows/c545d-umdh-isolated-preflight-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-toolchain:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      # Microsoft documents an untrustworthy UMDH capture in Windows 11 SDK
      # (UMDH 10.0.26100 observed in run 44924238758). Only install the older
      # Windows 10 debugger feature in this disposable CI VM; never on host.
      # The official archived SDK installer is unserviced: verify Authenticode
      # and run with no user data or credentials before GIO attribution.
      - name: Extract pinned Windows 10 Debugging Tools side-by-side in disposable CI folder
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          # The MSVC runner already contains 26100 UMDH, and even the signed
          # Win10 SDK feature installer does not replace it. Use a side-by-side
          # layout + MSI administrative extraction, documented by Microsoft.
          $sdkUrl='https://go.microsoft.com/fwlink/?linkid=2164145'
          $installer=Join-Path $env:RUNNER_TEMP 'c545d_msft_win10_sdk.exe'
          $layout=Join-Path $env:RUNNER_TEMP 'c545d_sdk20348_layout'
          $target=Join-Path $env:RUNNER_TEMP 'c545d_sdk20348_extracted'
          try {
            Invoke-WebRequest -Uri $sdkUrl -OutFile $installer -TimeoutSec 180
            if((Get-Item $installer).Length -lt 500000){throw 'Official SDK bootstrap too small'}
            $signature=Get-AuthenticodeSignature -FilePath $installer
            if($signature.Status -ne 'Valid' -or
               $signature.SignerCertificate.Subject -notmatch 'Microsoft'){
              throw 'Windows10 SDK signature not trusted'
            }
            New-Item -ItemType Directory -Force -Path $layout | Out-Null
            $p=Start-Process -FilePath $installer -ArgumentList @(
              '/layout', ('"'+$layout+'"'), '/features', 'OptionId.WindowsDesktopDebuggers',
              '/quiet', '/norestart'
            ) -Wait -PassThru
            if($p.ExitCode -notin @(0,3010)){throw 'MSFT Windows10 SDK layout failed'}
            $msis=@(Get-ChildItem -Path $layout -Filter '*.msi' -Recurse -File |
              Where-Object {$_.Name -match '(?i)debuggers.*x64|x64.*debuggers'})
            if($msis.Count -ne 1){
              throw "Expected one signed x64 Debuggers MSI in layout; found $($msis.Count)"
            }
            New-Item -ItemType Directory -Force -Path $target | Out-Null
            $p=Start-Process -FilePath 'msiexec.exe' -ArgumentList @(
              '/a', ('"'+$msis[0].FullName+'"'), ('TARGETDIR="'+$target+'"'),
              '/qn', '/norestart'
            ) -Wait -PassThru
            if($p.ExitCode -notin @(0,3010)){throw 'Debuggers MSI administrative extraction failed'}
            $old=@(Get-ChildItem -Path $target -Filter 'umdh.exe' -Recurse -File |
              Where-Object {
                $v=[Diagnostics.FileVersionInfo]::GetVersionInfo($_.FullName)
                $v.FileBuildPart -gt 0 -and $v.FileBuildPart -lt 22000
              })
            if($old.Count -ne 1){throw 'Exactly one Win10 UMDH not found in extracted x64 SDK'}
            $toolSignature=Get-AuthenticodeSignature -FilePath $old[0].FullName
            if($toolSignature.Status -ne 'Valid' -or
               $toolSignature.SignerCertificate.Subject -notmatch 'Microsoft'){
              throw 'Extracted Win10 UMDH signature could not be verified'
            }
            $ver=[Diagnostics.FileVersionInfo]::GetVersionInfo($old[0].FullName)
            "C545D_LEGACY_UMDH_EXE=$($old[0].FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "C545D_WIN10_UMDH_READY,build=$($ver.FileBuildPart),layout_used=1,side_by_side=1,microsoft_signed=1,CI_only=1,host_modified=0"
          } finally {
            Remove-Item $installer -Force -ErrorAction SilentlyContinue
            # The ephemeral runner retains the extracted tool for the next CI step.
            # No MSI data, raw SDK payload or symbol logs are uploaded.
          }
      - name: Discover Debugging Tools and test isolated synthetic allocation stacks
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Find-DebuggerTool([string]$name) {
            # Prefer 64-bit Debugging Tools for 64-bit MSVC target.
            foreach($folder in @(
              "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64",
              "$env:ProgramFiles\Windows Kits\10\Debuggers\x64"
            )) {
              $path=Join-Path $folder $name
              if(Test-Path $path -PathType Leaf){return $path}
            }
            $c=Get-Command $name -ErrorAction SilentlyContinue | Select-Object -First 1
            if($c){return $c.Source}
            return $null
          }
          $g=Find-DebuggerTool 'gflags.exe'
          $u=$env:C545D_LEGACY_UMDH_EXE
          if(-not $u -or -not(Test-Path $u -PathType Leaf)){
            throw 'Explicit Microsoft-signed Windows10 UMDH extraction prerequisite missing'
          }
          $gf=[int][bool]$g; $uf=[int][bool]$u
          if(-not($g -and $u)){
            Write-Host "C545D_UMDH_PREFLIGHT,gflags=$gf,umdh=$uf,stack_capture=0,reason=TOOLS_ABSENT,CI_only=1,host_modified=0"
            exit 0
          }
          $exeName='c545d_umdh_stack_preflight.exe'
          $ifeo="HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\$exeName"
          # Never overwrite inherited machine policy even on a disposable runner.
          if(Test-Path $ifeo){throw 'Synthetic image IFEO already exists; refusing change'}
          $dir=Join-Path $env:RUNNER_TEMP 'c545d_umdh_synthetic'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          & cl.exe /nologo /W4 /MT /O2 /TC tests/c545d_umdh_stack_preflight.c "/Fe:$dir\$exeName" | Out-Null
          if($LASTEXITCODE -ne 0){throw 'Synthetic MSVC build failed'}
          $proc=$null; $ustChanged=$false
          function Wait-Flag([string]$file) {
            for($n=0;$n -lt 200;$n++){
              if(Test-Path $file -PathType Leaf){return}
              Start-Sleep -Milliseconds 100
            }
            throw 'Synthetic process handshake timed out'
          }
          try {
            & $g /i $exeName +ust > $null 2>&1
            if($LASTEXITCODE -ne 0){throw 'UST enable command failed'}
            $ustChanged=$true
            $env:OANOCACHE='1'
            $proc=Start-Process -FilePath (Join-Path $dir $exeName) -WorkingDirectory $dir -PassThru
            Wait-Flag (Join-Path $dir 'ready.signal')
            $before=Join-Path $dir 'before.txt'; $after=Join-Path $dir 'after.txt'
            $captureLog=Join-Path $dir 'capture_status_local_only.txt'
            & $u "-p:$($proc.Id)" "-f:$before" > $captureLog 2>&1
            $captureExit=$LASTEXITCODE
            if($captureExit -ne 0 -or -not(Test-Path $before)){
              $info=[IO.File]::ReadAllText($captureLog)
              $class='UNKNOWN'
              # Microsoft published the 2025-06-11 known Windows11 SDK UMDH
              # false-full-stack-DB bug. Match BOTH exact symptoms; never
              # misclassify an actual full DB just from the word 'stack'.
              $badWin11Sdk=($info -match '(?i)UMDH didn.t find any allocations that have stacks collected') -and
                           ($info -match '(?i)Traces could not be collected because the Stack Trace Database is full')
              if($badWin11Sdk){ $class='MICROSOFT_WIN11_SDK_UMDH_KNOWN_BUG' }
              elseif($info -match '(?i)stack.trace.database|UST|stack.trace'){ $class='STACK_DB_OTHER' }
              elseif($info -match '(?i)access.denied|access.is.denied|privilege'){ $class='PRIVILEGE' }
              elseif($info -match '(?i)invalid.*(switch|parameter)|usage:|syntax'){ $class='SYNTAX' }
              elseif($info -match '(?i)process.*(exited|not.found|cannot.open|could.not.open)'){ $class='PROCESS' }
              elseif($info -match '(?i)symbol|pdb'){ $class='SYMBOLS' }
              $proc.Refresh()
              $alive=[int](-not $proc.HasExited)
              $filePresent=[int](Test-Path $before -PathType Leaf)
              $toolVersion=[Diagnostics.FileVersionInfo]::GetVersionInfo($u)
              $v=('{0}.{1}.{2}.{3}' -f $toolVersion.FileMajorPart,$toolVersion.FileMinorPart,$toolVersion.FileBuildPart,$toolVersion.FilePrivatePart)
              $gflagsKeyPresent=[int](Test-Path $ifeo)
              Write-Host "C545D_UMDH_CAPTURE_DIAG,exit=$captureExit,file=$filePresent,proc_alive=$alive,reason=$class,umdh_version=$v,ifeo_key=$gflagsKeyPresent,CI_only=1,raw_uploaded=0"
              throw 'UMDH baseline capture failed; diagnostic category above'
            }
            New-Item -ItemType File -Force -Path (Join-Path $dir 'allocate.signal') | Out-Null
            Wait-Flag (Join-Path $dir 'allocated.signal')
            & $u "-p:$($proc.Id)" "-f:$after" > $null 2>&1
            if($LASTEXITCODE -ne 0 -or -not(Test-Path $after)){throw 'UMDH allocation capture failed'}
            $diff=Join-Path $dir 'diff.txt'
            & $u $before $after > $diff 2>&1
            if($LASTEXITCODE -ne 0){throw 'UMDH diff failed'}
            # Do not print or upload raw addresses, symbol paths, heap snapshots
            # or user data. Only count positive stack deltas in local CI output.
            $matched=([regex]::Matches(
              [IO.File]::ReadAllText($diff),
              '(?im)^\s*\+\s+(?:0x)?[0-9a-f]+\s+\([^)]*\)\s+[0-9a-f]+\s+allocs\s+BackTrace[0-9a-f]+'
            )).Count
            if($matched -lt 1){throw 'No positive UMDH allocation-stack delta found'}
            Write-Host "C545D_UMDH_PREFLIGHT,gflags=1,umdh=1,stack_capture=1,positive_stacks=$matched,CI_only=1,host_modified=0,raw_uploaded=0"
          } finally {
            if($proc){
              New-Item -ItemType File -Force -Path (Join-Path $dir 'exit.signal') | Out-Null
              if(-not $proc.WaitForExit(3000)){Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue}
            }
            if($ustChanged){
              & $g /i $exeName -ust > $null 2>&1
              if($LASTEXITCODE -ne 0){throw 'Runner UST cleanup failed'}
              # Only remove a per-image key which was proven absent before test.
              if(Test-Path $ifeo){Remove-Item $ifeo -Recurse -Force}
            }
            Remove-Item Env:OANOCACHE -ErrorAction SilentlyContinue
            Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
          }
