name: C545D offline matched birth comparison audit
on:
  push:
    branches: ['investigate/c545d-status-only-monitor-20261120']
    paths:
      - 'tests/audit_c545d_gio_matched_birth_compare.py'
      - '.github/workflows/c545d-gio-matched-birth-audit-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Reject mismatched worker counts and invalid allocation lineage
        run: python3 tests/audit_c545d_gio_matched_birth_compare.py --selftest
      - name: Audit existing native comparison only if completed successfully
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status=$(gh api repos/taku077/c545d-recorder/actions/runs/46011977824 --jq '.status')
          conclusion=$(gh api repos/taku077/c545d-recorder/actions/runs/46011977824 --jq '.conclusion // "pending"')
          if [ "$status" != completed ] || [ "$conclusion" != success ]; then
            echo 'C545D_GIO_MATCHED_BIRTH_ACTUAL_PENDING_OR_FAILED,actual_qualified=0'
            exit 0
          fi
          gh run view 46011977824 --repo taku077/c545d-recorder --job 140549518513 --log > "$RUNNER_TEMP/matched-private.log"
          python3 tests/audit_c545d_gio_matched_birth_compare.py --input "$RUNNER_TEMP/matched-private.log"
          rm -f "$RUNNER_TEMP/matched-private.log"
