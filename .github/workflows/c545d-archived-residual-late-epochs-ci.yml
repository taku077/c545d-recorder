name: C545D archived Windows memory residual late-epoch audit (no rerun)
on:
  push:
    branches: ['investigate/c545d-status-only-monitor-20261120']
    paths:
      - 'tests/analyze_gio_cached_residual_plateau_guard.py'
      - 'tests/analyze_c545d_saved256_highwater.py'
      - 'tests/analyze_gio_cached_residual_epochs.py'
      - 'tests/analyze_gio_cached_gobject_cleanup.py'
      - '.github/workflows/c545d-archived-residual-late-epochs-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  archived-three-saved-runs-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download saved 256-cycle Windows2022 numeric-only record 1
        uses: actions/download-artifact@v4
        with:
          run-id: 44533452892
          name: c545d-display-cache-256-diagnostic
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: saved/44533452892
      - name: Download saved numeric-only record 2
        uses: actions/download-artifact@v4
        with:
          run-id: 44537371920
          name: c545d-display-cache-256-diagnostic
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: saved/44537371920
      - name: Download saved numeric-only record 3
        uses: actions/download-artifact@v4
        with:
          run-id: 44545844200
          name: c545d-display-cache-256-diagnostic
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: saved/44545844200
      - name: Retrieve exact original FOUR-arm 256 numeric-only artifact
        uses: actions/download-artifact@v4
        with:
          repository: taku077/c545d-recorder
          run-id: 44918598339
          name: c545d-msvc-core-native-cache-combo-ab256-numeric-CI-only
          github-token: ${{ github.token }}
          path: saved/original
      - name: Verify original high-water and older separate cache runs with no Windows work
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/analyze_c545d_saved256_highwater.py --selftest
          test -f saved/original/ab64_safe_trace.txt
          python3 tests/analyze_c545d_saved256_highwater.py --source saved/original --older saved | tee /tmp/c545d_highwater.txt
          test "$(grep -c '^C545D_256_HIGHWATER_EPOCH,' /tmp/c545d_highwater.txt)" -eq 24
          test "$(grep -c '^C545D_256_HIGHWATER_OLDER_CACHE,' /tmp/c545d_highwater.txt)" -eq 3
          grep -Fx 'C545D_256_HIGHWATER_PASS,source_original=44918598339,older_archived_runs=3,original_processes=4,per_cycle_checkpoints=257,original_windows_rerun=0,all_outputs_numeric_only=1,permanent_plateau_proven=0,production_changes=0' /tmp/c545d_highwater.txt
          echo 'C545D_256_HIGHWATER_SAVED_ONLY_PASS,source=44918598339,old_runs=3,windows_runs=0'
      - name: Check source evidence and distinct last64 heap vs committed memory outcomes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/numeric
          # Exact same unchanged source blob was checked at original jobs
          # 44533452892 (45134eff), 44537371920 (9467e2e5) and
          # 44545844200 (ac5acafc). GIO_VM first field is VQ MEM_PRIVATE,
          # not GetProcessMemoryInfo PrivateUsage.
          test "$(git hash-object tests/gio_appinfo_key_handle_probe.c)" = 36411d34ea324115c13335b6d1248787811e6271
          python tests/analyze_gio_cached_residual_epochs.py --selftest
          python tests/analyze_gio_cached_residual_plateau_guard.py --selftest
          python tests/analyze_gio_cached_residual_plateau_guard.py --root saved | tee artifacts/numeric/c545d_late_epoch_gate.txt
          grep -qx 'C545D_LATE_EPOCH_GUARD_PASS,old_windows_runs=3,new_windows_runs=0,control_subtracted=1,private_late_positive=2of3,exact_360_bin_late_positive=3of3,no_proven_zero_leak=1,no_proven_infinite_plateau=1,allocation_stacks_attributed=0,host_validated=0' artifacts/numeric/c545d_late_epoch_gate.txt
          grep -Fx 'C545D_OLD_VM_METRIC_SCOPE,source_blob=36411d34ea324115c13335b6d1248787811e6271,source_runs=44533452892;44537371920;44545844200,archived_field=GIO_VM_first_numeric,measurement=VirtualQuery_MEM_COMMIT_MEM_PRIVATE_region_bytes,PSAPI_PrivateUsage=0,comparable_with_GIO_PROBE_PrivateUsage=0,legacy_internal_alias_private_usage=1' artifacts/numeric/c545d_late_epoch_gate.txt
          test "$(grep -c '^C545D_LATE_EPOCH_NUMERIC,' artifacts/numeric/c545d_late_epoch_gate.txt)" -eq 3
          echo 'C545D_CACHED_LATE_EPOCH_REANALYSIS_PASS,reused_original_windows_artifacts=3,new_windows_runs=0,real_camera=0'
      - name: Audit the seven live GObject types at archived 256 and optional cleanup points
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/analyze_gio_cached_gobject_cleanup.py --selftest
          python3 tests/analyze_gio_cached_gobject_cleanup.py --root saved | tee artifacts/numeric/c545d_gobject_cleanup_numeric.txt
          test "$(grep -c '^C545D_SAVED_GOBJECT_COHORT,' artifacts/numeric/c545d_gobject_cleanup_numeric.txt)" -eq 6
          grep -F 'C545D_SAVED_GOBJECT_CLEANUP_PASS,archived_windows_runs=3,arms=2,modes=2,types=7,cleanup_available=' artifacts/numeric/c545d_gobject_cleanup_numeric.txt
          echo 'C545D_SAVED_GOBJECT_CLEANUP_CI_PASS,archived_runs=3,new_windows_runs=0'
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: c545d-saved-gobject-cleanup-aggregate-no-windows
          path: artifacts/numeric/c545d_gobject_cleanup_numeric.txt
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: c545d-saved-late-epoch-no-windows-numeric-only
          path: artifacts/numeric/c545d_late_epoch_gate.txt
          if-no-files-found: error
          retention-days: 7
