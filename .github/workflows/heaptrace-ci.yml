name: HeapTrace diagnostics safety and syntax

on:
  pull_request:
    branches: [main]
    paths:
      - 'diagnostics/**'
      - '.github/workflows/heaptrace-ci.yml'
  push:
    branches: [main]
    paths:
      - 'diagnostics/**'
      - '.github/workflows/heaptrace-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check Windows PowerShell 5.1 parser (do not run live capture)
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path='diagnostics/HeapTrace.ps1'
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $path),[ref]$tokens,[ref]$errors)|Out-Null
          if(@($errors).Count) {
            $errors|Out-String|Write-Host
            throw 'Windows PowerShell 5.1 HeapTrace parse failed'
          }
          Write-Host 'PASS: no PowerShell syntax errors'
      - name: Safe UMDH differential report against synthetic secret/PII
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File diagnostics/HeapTrace.ps1 -Mode SelfTest
          if($LASTEXITCODE -ne 0) {throw 'UMDH schema-only self-test failed'}
      - name: Offline UMDH module attribution / no secrets selftest
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File diagnostics/Reanalyze-HeapDiff.ps1 -Mode SelfTest
          if($LASTEXITCODE -ne 0) {throw 'Offline UMDH safe module attribution self-test failed'}
      - name: Offline original UMDH BackTrace join (PS5.1 synthetic + privacy)
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'diagnostics/Resolve-ExistingUMDHBacktraces.ps1'),
            [ref]$tokens,[ref]$errors) | Out-Null
          if(@($errors).Count) {
            $errors | Out-String | Write-Host
            throw 'Original BackTrace join PS5.1 syntax failed'
          }
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File diagnostics/Resolve-ExistingUMDHBacktraces.ps1 -Mode SelfTest
          if($LASTEXITCODE -ne 0) {throw 'Original BackTrace join self-test failed'}
      - name: Check action is read-only (no GFlags changes)
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $reg='HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\gst-launch-1.0.exe'
          $before=(Get-ItemProperty -LiteralPath $reg -Name GlobalFlag -ErrorAction SilentlyContinue).GlobalFlag
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File diagnostics/HeapTrace.ps1 -Mode Check
          if($LASTEXITCODE -ne 0) {throw 'Preflight failed'}
          $after=(Get-ItemProperty -LiteralPath $reg -Name GlobalFlag -ErrorAction SilentlyContinue).GlobalFlag
          if($before -ne $after) {throw 'Read-only check unexpectedly changed GFlags'}
          Write-Host 'PASS: read-only preflight does not change image GFlags'
      - name: Package standalone diagnostic-only helper (not recorder EXE)
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -LiteralPath @(
            'diagnostics/HeapTrace.ps1',
            'diagnostics/Reanalyze-HeapDiff.ps1',
            'diagnostics/Resolve-ExistingUMDHBacktraces.ps1',
            'diagnostics/Check-HeapTools.cmd',
            'diagnostics/README_HEAP_TRACE_JA.md'
          ) -DestinationPath dist/C545D_HeapTrace_Diagnostics_Kit.zip -CompressionLevel Optimal -Force
      - uses: actions/upload-artifact@v4
        with:
          name: c545d-heaptrace-diagnostic-kit-windows
          path: dist/C545D_HeapTrace_Diagnostics_Kit.zip
          retention-days: 14
      - name: Publish direct-download diagnostic-only GitHub Release (not recorder)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $tag='c545d-heaptrace-original-backtrace-join-20261118'
          $zip='dist/C545D_HeapTrace_Diagnostics_Kit.zip'
          if (-not (Test-Path -LiteralPath $zip)) { throw 'Diagnostic ZIP missing' }
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $zip --repo $env:GITHUB_REPOSITORY --title 'C545D UMDH original BackTrace join (offline original T2; NOT recorder EXE)' --notes 'Opt-in offline-only original UMDH T2 BackTrace join. Includes safe allowlist summary of top three positive diff traces. Reuses existing PID9424 raw files, does not capture/restart/change UST. No raw stack export. Does not modify recorder EXE or media settings. Needs separately installed Microsoft Debugging Tools for Windows x64. Read README_HEAP_TRACE_JA.md before any UST registry change. Synthetic Windows tests only; user camera/UMDH runtime not yet validated.' --prerelease --latest=false
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release asset publication failed' }
          Write-Host 'PASS: direct-download HeapTrace diagnostic ZIP published'
