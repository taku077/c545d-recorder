name: C545D saved 256-cycle per-cycle PrivateUsage/handles timeline (NO Windows)
on:
  push:
    branches: ['investigate/c545d-status-only-monitor-20261120']
    paths:
      - 'tests/analyze_gio_combo_msvc256_trend.py'
      - 'tests/audit_gio_2824_registry_apc_cleanup.py'
      - 'tests/audit_gio_2824_graph_lifetime.py'
      - 'tests/patch_glib_2824_parser_com_balance_ci.py'
      - '.github/workflows/c545d-saved256-trend-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect-existing-numeric:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Strictly reject five malformed 256-cycle PrivateUsage timelines
        run: |
          set -euo pipefail
          python3 tests/analyze_gio_combo_msvc256_trend.py --selftest
          echo 'C545D_SAVED256_STEP_PREFLIGHT_PASS,windows_runs=0,host_modified=0'
      - name: Read exact public GNOME GLib 2.82.4 sources for APC/worker audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/c545d_glib_2824
          curl -fsSL --retry 3 --max-time 30 'https://raw.githubusercontent.com/GNOME/glib/2.82.4/gio/gwin32appinfo.c' -o /tmp/c545d_glib_2824/gwin32appinfo.c
          curl -fsSL --retry 3 --max-time 30 'https://raw.githubusercontent.com/GNOME/glib/2.82.4/gio/gwin32registrykey.c' -o /tmp/c545d_glib_2824/gwin32registrykey.c
          curl -fsSL --retry 3 --max-time 30 'https://raw.githubusercontent.com/GNOME/glib/2.82.4/gio/gwin32packageparser.c' -o /tmp/c545d_glib_2824/gwin32packageparser.c
          test -s /tmp/c545d_glib_2824/gwin32appinfo.c
          test -s /tmp/c545d_glib_2824/gwin32registrykey.c
          test -s /tmp/c545d_glib_2824/gwin32packageparser.c
      - name: Fail-closed source-order audit for deferred registry APC cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/audit_gio_2824_registry_apc_cleanup.py --selftest
          python3 tests/audit_gio_2824_registry_apc_cleanup.py \
            --appinfo /tmp/c545d_glib_2824/gwin32appinfo.c \
            --registry /tmp/c545d_glib_2824/gwin32registrykey.c \
            --probe tests/gio_appinfo_key_handle_probe.c \
            --monitor-patch tests/patch_glib_appinfo_monitor_worker_diagnostic.py \
            --workflow .github/workflows/c545d-core-gio-msvc-native-cache-ab256-ci.yml | tee /tmp/c545d_apc_source.txt
          grep -Fx 'C545D_GIO_APC_SOURCE_AUDIT_PASS,new_windows_runs=0,user_host_modified=0,leak_owner_known=0,release_approved=0' /tmp/c545d_apc_source.txt
          test "$(grep -Ec '^C545D_GIO_(APC_SOURCE|WORKER_SOURCE|CLEANUP_SOURCE|MONITOR_SCOPE)_AUDIT,' /tmp/c545d_apc_source.txt)" -eq 4
      - name: Audit AppInfo graph and COM failure cleanup in disposable GLib 2.82.4 source
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/patch_glib_2824_parser_com_balance_ci.py --selftest
          python3 tests/audit_gio_2824_graph_lifetime.py --selftest
          cp /tmp/c545d_glib_2824/gwin32appinfo.c /tmp/c545d_glib_2824/gwin32appinfo-weak.c
          cp /tmp/c545d_glib_2824/gwin32packageparser.c /tmp/c545d_glib_2824/gwin32packageparser-com-balanced.c
          python3 tests/patch_glib_appinfo_weak_backrefs.py /tmp/c545d_glib_2824/gwin32appinfo-weak.c
          python3 tests/patch_glib_2824_parser_com_balance_ci.py /tmp/c545d_glib_2824/gwin32packageparser-com-balanced.c
          python3 tests/audit_gio_2824_graph_lifetime.py \
            --original /tmp/c545d_glib_2824/gwin32appinfo.c \
            --weak /tmp/c545d_glib_2824/gwin32appinfo-weak.c \
            --package /tmp/c545d_glib_2824/gwin32packageparser.c \
            --balanced /tmp/c545d_glib_2824/gwin32packageparser-com-balanced.c | tee /tmp/c545d_graph_source.txt
          test "$(grep -Ec '^C545D_GIO_(GRAPH_BACKREF|GRAPH_ROOT|WINRT_CLEANUP|COM_FAILURE_PATH)_AUDIT,' /tmp/c545d_graph_source.txt)" -eq 4
          grep -Fx 'C545D_GIO_GRAPH_SOURCE_AUDIT_PASS,source_tag=2.82.4,no_runtime_or_host_changed=1,zero_leak_proven=0,new_windows_runs=0' /tmp/c545d_graph_source.txt
      - name: Retrieve only original Windows2022 run 44918598339 sanitized NUMERIC archive
        uses: actions/download-artifact@v4
        with:
          name: c545d-msvc-core-native-cache-combo-ab256-numeric-CI-only
          run-id: 44918598339
          github-token: ${{ github.token }}
          path: artifacts/saved
      - name: Analyze each original cycle; no source-code Windows recompilation
        run: |
          set -euo pipefail
          test -f artifacts/saved/ab64_safe_trace.txt
          python3 tests/analyze_gio_combo_msvc256_trend.py --root artifacts/saved | tee /tmp/c545d_saved256_steps.txt
          grep -Fx 'C545D_SAVED256_STEP_ANALYSIS_PASS,source_run=44918598339,original_cycles=256,windows_runs=0,resource_metrics=2,counterfactuals_matched=1,zero_leak_proven=0,host_install_approved=0' /tmp/c545d_saved256_steps.txt
          test "$(grep -c '^C545D_SAVED256_STEP,' /tmp/c545d_saved256_steps.txt)" -eq 16
          test "$(grep -c '^C545D_SAVED256_END,' /tmp/c545d_saved256_steps.txt)" -eq 4
          test "$(grep -c '^C545D_SAVED256_MONITOR_ALIGNMENT,' /tmp/c545d_saved256_steps.txt)" -eq 16
          test "$(grep -c '^C545D_SAVED256_COUNTER_SCOPE,' /tmp/c545d_saved256_steps.txt)" -eq 2
          grep -Fx 'C545D_SAVED256_MONITOR_ALIGNMENT_PASS,source_run=44918598339,arms=4,windows=4,windows_checked=16,combo_counters=2,new_windows_runs=0,notifications_are_not_alloc_stacks=1,real_device_untested=1' /tmp/c545d_saved256_steps.txt
          test "$(grep -c '^C545D_SAVED256_CACHE_REBUILD,' /tmp/c545d_saved256_steps.txt)" -eq 2
          test "$(grep -c '^C545D_SAVED256_CLEANUP_RESOURCE,' /tmp/c545d_saved256_steps.txt)" -eq 4
          grep -Fx 'C545D_SAVED256_CACHE_REBUILD_PASS,source_run=44918598339,snapshot_order_preserved=1,registry_scans=258,nochange_scans=1,displayname_cache_entries_stay_32=1,allocation_owner_proven=0,new_windows_runs=0' /tmp/c545d_saved256_steps.txt
          echo 'C545D_SAVED256_STEP_CI_PASS,original_windows_run=44918598339,new_windows_runs=0,host_modified=0'
