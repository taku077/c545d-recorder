name: C545D future Win10 isolated GIO camera-free bundle verification CI ONLY
on:
  push:
    branches: ['investigate/c545d-status-only-monitor-20261120']
    paths:
      - '.github/workflows/c545d-future-isolated-gio-bundle-ci.yml'
      - 'tools/RUN_C545D_ISOLATED_GIO_SMOKE_FUTURE_APPROVAL_ONLY.cmd'
      - 'tools/Invoke-C545DWin10IsolatedGioSmoke.ps1'
      - 'tools/Get-C545DGStreamerHostFingerprintReadOnly.ps1'
      - 'docs/C545D_FUTURE_HOST_SMOKE_NOT_APPROVED.txt'
      - 'docs/CORE_GIO_SDK_1288_REFERENCE.json'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  package-future-only:
    runs-on: windows-2022
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: c545d-core-only-gio-2824-msvc-ci-not-for-install
          repository: taku077/c545d-recorder
          run-id: 44757713497
          github-token: ${{ github.token }}
          path: artifacts/previously-qualified-candidate
      - name: Verify exact binary provenance and create NON-APPROVED bundle only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $cand=(Resolve-Path artifacts/previously-qualified-candidate/gio-2.0-0.dll).Path
          $manifest=(Resolve-Path artifacts/previously-qualified-candidate/manifest.txt).Path
          $wantCandidate='67B9F7246E4744FEF7EE1EAD3BED4CE2179C6F0465EC68A92D01DD12B4A3CCAD'
          $wantSdk='A875107C180FB248236D1E96E14F362F117124DF2FEE1237FA2142B7B363941B'
          if((Get-FileHash -LiteralPath $cand -Algorithm SHA256).Hash -cne $wantCandidate){throw 'Candidate SHA changed'}
          $m=[IO.File]::ReadAllText($manifest)
          # Match the exact three signed manifest fields with the same
          # PowerShell 5.1-compatible patterns as the qualified smoke runner.
          if($m -notmatch ('(?m)^CANDIDATE_GIO_SHA256='+$wantCandidate+'\r?$')){throw 'MANIFEST_FIELD_1'}
          if($m -notmatch ('(?m)^REFERENCE_GIO_SHA256='+$wantSdk+'\r?$')){throw 'MANIFEST_FIELD_2'}
          if($m -notmatch '(?m)^C545D_RELEASE_CANDIDATE_STATUS=CI_TEST_ONLY_NOT_APPROVED_FOR_HOST\r?$'){throw 'MANIFEST_FIELD_3'}
          $f=[IO.File]::OpenRead($cand);$reader=[IO.BinaryReader]::new($f)
          try {
            if($f.Length -lt 256 -or $reader.ReadUInt16() -ne 0x5A4D){throw 'Not PE'}
            $f.Position=0x3c;$off=$reader.ReadInt32()
            if($off -lt 64 -or $off -gt ($f.Length - 24)){throw 'PE header invalid'}
            $f.Position=$off
            if($reader.ReadUInt32() -ne 0x4550 -or $reader.ReadUInt16() -ne 0x8664){throw 'Not x64 PE'}
          }finally{$reader.Dispose()}
          $pinned=@{
            'gio-2.0-0.dll'='A875107C180FB248236D1E96E14F362F117124DF2FEE1237FA2142B7B363941B'
            'glib-2.0-0.dll'='CAF29CFC1467E3A3E5E91F0F649BD7A501107D9B3C32A2866B08E2ECFA209E3E'
            'gobject-2.0-0.dll'='811DAB4B420E520D91AC3FE5202975CC90CAF2C53EF2F8F0FCE8F8588A735C7A'
            'gmodule-2.0-0.dll'='86BE81A7011EC07E1992CE7A742AD881A80AE38583BBCFFBF973498D4748DAC5'
            'intl-8.dll'='2EF6A23F712FD7B9BF72B2FEF1A1FD5CDE27BA88F7D164E9E6DE18936C1F51B0'
            'z-1.dll'='B84851F9084247F466C076EE993BD5A92F3462466C4877B5C4ECC4125743A060'
          }
          $reference=(Resolve-Path docs/CORE_GIO_SDK_1288_REFERENCE.json).Path
          $json=Get-Content -LiteralPath $reference -Raw | ConvertFrom-Json
          if($json.schema -ne 1 -or $json.install_approved -ne $false -or
             $json.sdk -cne 'gstreamer-1.0-msvc-x86_64-1.28.8' -or
             ([string]$json.candidate_sha256).ToUpperInvariant() -cne $wantCandidate -or
             $json.dll_sha256.PSObject.Properties.Count -ne 6){throw 'Reference metadata invalid'}
          foreach($key in $pinned.Keys){
            if(([string]$json.dll_sha256.PSObject.Properties[$key].Value).ToUpperInvariant() -cne $pinned[$key]){throw 'Reference hash is not pinned'}
          }
          foreach($source in @('tools/Invoke-C545DWin10IsolatedGioSmoke.ps1','tools/Get-C545DGStreamerHostFingerprintReadOnly.ps1')){
            $tokens=$null;$errors=$null
            [Management.Automation.Language.Parser]::ParseFile((Resolve-Path $source).Path,[ref]$tokens,[ref]$errors) | Out-Null
            if($errors.Count -gt 0){throw 'Invalid bundled PowerShell source'}
          }
          $launch=Get-Content tools/RUN_C545D_ISOLATED_GIO_SMOKE_FUTURE_APPROVAL_ONLY.cmd -Raw
          if($launch -notmatch 'choice /C YN' -or
             $launch -notmatch 'Invoke-C545DWin10IsolatedGioSmoke\.ps1' -or
             $launch -notmatch 'DO NOT' -and $launch -notmatch 'NOT APPROVED'){throw 'Launcher missing approval refusal'}
          $note=Get-Content docs/C545D_FUTURE_HOST_SMOKE_NOT_APPROVED.txt -Raw
          if($note -notmatch 'NOT APPROVED FOR HOST EXECUTION' -or
             $note -notmatch 'Never copy|Do NOT copy'){throw 'Safety notice missing'}
          $dst=Join-Path $env:RUNNER_TEMP ('c545d-future-host-package-'+[guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $dst | Out-Null
          $inputs=@(
            'tools/RUN_C545D_ISOLATED_GIO_SMOKE_FUTURE_APPROVAL_ONLY.cmd',
            'tools/Invoke-C545DWin10IsolatedGioSmoke.ps1',
            'tools/Get-C545DGStreamerHostFingerprintReadOnly.ps1',
            'docs/C545D_FUTURE_HOST_SMOKE_NOT_APPROVED.txt',
            'docs/CORE_GIO_SDK_1288_REFERENCE.json',
            $cand,$manifest
          )
          foreach($item in $inputs){Copy-Item -LiteralPath $item -Destination $dst}
          $names=@(Get-ChildItem -LiteralPath $dst -File | ForEach-Object {$_.Name} | Sort-Object)
          $expected=@('C545D_FUTURE_HOST_SMOKE_NOT_APPROVED.txt',
                      'CORE_GIO_SDK_1288_REFERENCE.json',
                      'Get-C545DGStreamerHostFingerprintReadOnly.ps1',
                      'Invoke-C545DWin10IsolatedGioSmoke.ps1',
                      'RUN_C545D_ISOLATED_GIO_SMOKE_FUTURE_APPROVAL_ONLY.cmd',
                      'gio-2.0-0.dll','manifest.txt') | Sort-Object
          if(($names -join ',') -cne ($expected -join ',')){throw 'Unexpected bundle files'}
          if(@(Get-ChildItem -LiteralPath $dst -Recurse -Include *.exe,*.msi).Count -gt 0){throw 'Bundle may not contain EXE or installer'}
          if((Get-FileHash -LiteralPath (Join-Path $dst 'gio-2.0-0.dll') -Algorithm SHA256).Hash -cne $wantCandidate){throw 'Staged DLL changed'}
          New-Item -ItemType Directory artifacts/numeric -Force | Out-Null
          $zip='artifacts/C545D_FUTURE_WIN10_CAMERA_FREE_GIO_SMOKE_NOT_APPROVED.zip'
          Compress-Archive -Path (Join-Path $dst '*') -DestinationPath $zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive=[IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip).Path)
          try{
            $zipNames=@($archive.Entries | ForEach-Object {$_.FullName} | Sort-Object)
            if(($zipNames -join ',') -cne ($expected -join ',')){throw 'Archive entries unexpectedly changed'}
          }finally{$archive.Dispose()}
          $line='C545D_FUTURE_HOST_BUNDLE_CI_PASS,files=7,candidate_sha_match=1,core_reference_pinned=1,manifest_verified=1,guarded_launcher=1,source_syntax=1,not_installer=1,windows10_tested=0,host_executed=0,install_approved=0,live_tapo_authorized=0'
          $line | Set-Content -LiteralPath artifacts/numeric/future_host_bundle_ci_result.txt -Encoding ascii
          Write-Host $line
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: c545d-FUTURE-camera-free-isolated-GIO-not-approved-for-host
          path: |
            artifacts/C545D_FUTURE_WIN10_CAMERA_FREE_GIO_SMOKE_NOT_APPROVED.zip
            artifacts/numeric/future_host_bundle_ci_result.txt
          retention-days: 7
          if-no-files-found: error
