name: C545D DisplayName exact-cache 256-cycle Windows residual A/B

on:
  pull_request:
    paths:
      - 'tests/patch_glib_uwp_displayname_cache_diagnostic.py'
      - 'tests/analyze_gio_displayname_cache_long.py'
      - '.github/workflows/c545d-gio-displayname-cache-long-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c545d-display-cache-long
  cancel-in-progress: true

jobs:
  paired-256:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-pcre2
            mingw-w64-x86_64-libffi
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-gettext
            mingw-w64-x86_64-python

      - name: Build disposable combined GLib and exact WinRT DisplayName cache
        shell: msys2 {0}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 2.82.4 https://github.com/GNOME/glib.git glib-src
          python tests/patch_glib_appinfo_weak_backrefs.py glib-src/gio/gwin32appinfo.c
          python tests/patch_glib_registry_owned_path.py glib-src/gio/gwin32registrykey.c
          python tests/patch_glib_uwp_api_isolation.py glib-src/gio/gwin32appinfo.c glib-src/gio/gwin32packageparser.c
          python tests/patch_glib_uwp_displayname_cache_diagnostic.py glib-src/gio/gwin32packageparser.c
          git -C glib-src diff --check
          meson setup glib-build glib-src -Dglib_debug=enabled -Dtests=false -Dintrospection=disabled -Ddocumentation=false -Dman-pages=disabled -Ddefault_library=shared
          meson compile -C glib-build
          meson devenv -C glib-build sh -c 'gcc -O2 -Wall -Wextra -o gio_appinfo_probe.exe ../tests/gio_appinfo_key_handle_probe.c $(pkg-config --cflags --libs gio-2.0) -lpsapi -ladvapi32'
          mkdir -p artifacts
          echo 'CI_ONLY_ORIGINAL_DISPLAYNAME_CACHE_NOT_PRODUCTION' > artifacts/NO_RELEASE.txt

      - name: Paired 256-cycle default and cache over same disposable Windows runner
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export GOBJECT_DEBUG=instance-count
          unset C545D_HANDLE_EXE || true
          for mode in default cache; do
            unset C545D_DIAG_UWP_CACHE_DISPLAYNAME C545D_DIAG_UWP_SKIP_CURRENT C545D_DIAG_UWP_NO_DISPLAYNAME_GETTER C545D_DIAG_UWP_CALL_DISPLAYNAME_DISCARD C545D_DIAG_UWP_SKIP_DISPLAYNAME || true
            if [ "$mode" = cache ]; then export C545D_DIAG_UWP_CACHE_DISPLAYNAME=1; fi
            for scope in nochange registry; do
              args=(--cycles=256 --heap-summary --vm-summary --report-types)
              if [ "$scope" = nochange ]; then args+=(--no-registry-change); fi
              echo "C545D_CACHE_LONG_START,mode=$mode,scope=$scope"
              meson devenv -C glib-build "$PWD/glib-build/gio_appinfo_probe.exe" "${args[@]}" > "artifacts/${mode}_${scope}_256.log"
              grep -q 'GIO_PROBE_DONE,cycles=256' "artifacts/${mode}_${scope}_256.log"
              if [ "$mode" = cache ]; then
                grep -q '^C545D_DISPLAY_CACHE,hits=' "artifacts/${mode}_${scope}_256.log"
              fi
              echo "C545D_CACHE_LONG_COMPLETE,mode=$mode,scope=$scope"
            done
          done

      - name: Analyze last-128 matched controls, handles, cache ceiling and slope
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          py tests/analyze_gio_displayname_cache_long.py
          if ($LASTEXITCODE -ne 0) { throw '256-cycle cache diagnostic gate failed' }
          Get-Content artifacts/cache_long_comparison.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c545d-display-cache-256-diagnostic
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
