name: C545D offline enumeration substage audit
on:
  push:
    branches: ['investigate/c545d-status-only-monitor-20261120']
    paths:
      - 'tests/audit_c545d_gio_enum_substage_ci.py'
      - '.github/workflows/c545d-gio-enum-audit-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Test complete and partial substage records
        run: python3 tests/audit_c545d_gio_enum_substage_ci.py --selftest
      - name: Reuse exact native log if completed successfully
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=46028073129
          job=140604509865
          sha=f0026ddad9ffbda443fc712de314a500f86d24b0
          gh api "repos/taku077/c545d-recorder/actions/runs/$run" > "$RUNNER_TEMP/run.json"
          jq -e --arg sha "$sha" '.head_sha == $sha' "$RUNNER_TEMP/run.json" >/dev/null
          if ! jq -e '.status == "completed" and .conclusion == "success"' "$RUNNER_TEMP/run.json" >/dev/null; then
            echo 'C545D_ENUM_AUDIT_PENDING_OR_FAILED,actual_qualified=0'
            exit 0
          fi
          gh api "repos/taku077/c545d-recorder/actions/jobs/$job" > "$RUNNER_TEMP/job.json"
          jq -e --argjson run "$run" --arg sha "$sha" '.run_id == $run and .head_sha == $sha and .conclusion == "success"' "$RUNNER_TEMP/job.json" >/dev/null
          trap 'rm -f "$RUNNER_TEMP/enum-private.log"' EXIT
          gh run view "$run" --repo taku077/c545d-recorder --job "$job" --log > "$RUNNER_TEMP/enum-private.log"
          python3 tests/audit_c545d_gio_enum_substage_ci.py --input "$RUNNER_TEMP/enum-private.log"
