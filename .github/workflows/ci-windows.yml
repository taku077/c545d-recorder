name: Windows PowerShell source validation
on:
  push:
    branches: [main]
    paths:
      - '*.ps1'
      - '*.vbs'
      - 'README.txt'
      - 'tests/**'
      - '.github/workflows/ci-windows.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check required application sources
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $required=@('C545D_App.ps1','Record.ps1','RecordGUIWorker.ps1','SegmentNamer.ps1','SegmentNamerWorker.ps1','CommonSettings.ps1','RecoverPending.ps1','C545D_Start.vbs','README.txt')
          $missing=@($required | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) })
          if ($missing.Count -gt 0) { throw "Missing source files: $($missing -join ', ')" }
      - name: Parse PowerShell (without executing camera code)
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Get-ChildItem -File -Filter '*.ps1' | ForEach-Object {
            $tokens=$null
            $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if (@($errors).Count) { $errors | Out-String | Write-Host; throw "Parse error in $($_.Name)" }
            Write-Host "PASS $($_.Name)"
          }
      - name: Check stable recording settings against accidental changes
        shell: powershell
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/Assert-Recorder-Invariants.ps1
      - name: Verify actual H264 camera graph token assembly and separator safety
        shell: powershell
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/Assert-Recorder-GraphSyntax.ps1
      - name: Test recording exit policy without connecting cameras
        shell: powershell
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/Assert-Recorder-ExitPolicy.ps1
      - name: Set up Python for offline memory-trend unit tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit-test per-PID memory trend analysis (synthetic fixtures only)
        shell: powershell
        run: |
          python -m unittest discover -s tests -p test_memory_trend.py -v
      - name: Reject sensitive file types from Git
        shell: powershell
        run: |
          $forbidden=@(git ls-files | Where-Object { $_ -match '(?i)(\.mp4$|\.mkv$|\.etl$|\.dmp$|camera_password\.dpapi$|settings\.json$|(^|/)logs/|(^|/)control/|(^|/)recording_.*\.txt$|(^|/)memory_trend.*\.csv$)' })
          if ($forbidden.Count) { throw "Sensitive files included: $($forbidden -join ', ')" }
      - name: Package unmodified portable source app
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $required=@('C545D_App.ps1','Record.ps1','RecordGUIWorker.ps1','SegmentNamer.ps1','SegmentNamerWorker.ps1','CommonSettings.ps1','RecoverPending.ps1','C545D_Start.vbs','README.txt')
          Compress-Archive -Path $required -DestinationPath dist/C545D_Recorder_Source.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: c545d-source-bundle
          path: dist/C545D_Recorder_Source.zip
          retention-days: 7
