name: C545D offline matched contrast preflight
on:
  push:
    branches: ['investigate/c545d-status-only-monitor-20261120']
    paths:
      - 'tests/audit_c545d_gio_matched_birth_contrast.py'
      - '.github/workflows/c545d-gio-matched-contrast-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check signed contrasts and lineage metrics
        run: |
          python3 tests/audit_c545d_gio_matched_birth_compare.py --selftest
          python3 tests/audit_c545d_gio_matched_birth_contrast.py --selftest
      - name: Reuse exact successful native log if available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=46015818820
          job=140562531873
          sha=0836d99bf982e22ec92dd178ecb7730cde960f8a
          gh api "repos/taku077/c545d-recorder/actions/runs/$run" > "$RUNNER_TEMP/run.json"
          jq -e --arg sha "$sha" '.head_sha == $sha' "$RUNNER_TEMP/run.json" >/dev/null
          if ! jq -e '.status == "completed" and .conclusion == "success"' "$RUNNER_TEMP/run.json" >/dev/null; then
            echo 'C545D_GIO_MATCHED_CONTRAST_PENDING_OR_FAILED,actual_qualified=0'
            exit 0
          fi
          gh api "repos/taku077/c545d-recorder/actions/jobs/$job" > "$RUNNER_TEMP/job.json"
          jq -e --argjson run "$run" --arg sha "$sha" '.run_id == $run and .head_sha == $sha and .conclusion == "success"' "$RUNNER_TEMP/job.json" >/dev/null
          trap 'rm -f "$RUNNER_TEMP/matched-private.log"' EXIT
          gh run view "$run" --repo taku077/c545d-recorder --job "$job" --log > "$RUNNER_TEMP/matched-private.log"
          python3 tests/audit_c545d_gio_matched_birth_contrast.py --input "$RUNNER_TEMP/matched-private.log"
