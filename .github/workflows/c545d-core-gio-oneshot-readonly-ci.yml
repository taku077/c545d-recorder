name: C545D unified Windows GIO read-only preflight and fail-closed controls (CI ONLY)
on:
  push:
    branches: ['investigate/c545d-status-only-monitor-20261120']
    paths:
      - '.github/workflows/c545d-core-gio-oneshot-readonly-ci.yml'
      - 'tools/Test-C545DCoreGioOneShotReadOnly.ps1'
      - 'tools/Test-C545DCoreGioReadOnly.ps1'
      - 'tools/Test-C545DCoreGioDependencyGraphReadOnly.ps1'
      - 'docs/CORE_GIO_SDK_1288_REFERENCE.json'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  one-shot-safety:
    runs-on: windows-2022
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: c545d-core-only-gio-2824-msvc-ci-not-for-install
          repository: taku077/c545d-recorder
          run-id: 44757713497
          github-token: ${{ github.token }}
          path: artifacts/core-rc
      - name: Install exact official 1.28.8 MSVC SDK only in disposable CI Windows Server
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          $sdk=Join-Path $env:RUNNER_TEMP 'c545d-sdk-1.28.8'
          $installer=Join-Path $env:RUNNER_TEMP 'c545d-sdk-1.28.8.exe'
          Invoke-WebRequest 'https://gstreamer.freedesktop.org/data/pkg/windows/1.28.8/msvc/gstreamer-1.0-msvc-x86_64-1.28.8.exe' -OutFile $installer -TimeoutSec 180
          if((Get-Item $installer).Length -lt 15000000){throw 'Official SDK installer incomplete'}
          $p=Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/TYPE=devel',"/DIR=$sdk") -Wait -PassThru
          if($p.ExitCode -ne 0){throw 'Official SDK setup failed'}
          "C545D_ONE_SHOT_SDK_BIN=$(Join-Path $sdk 'bin')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify source is read-only, exact matching reference blocked on Server, and four negative scenarios
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $script=(Resolve-Path tools/Test-C545DCoreGioOneShotReadOnly.ps1).Path
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($script,[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count -gt 0){throw 'One-shot PowerShell source parsing failed'}
          $source=Get-Content $script -Raw
          foreach($mutator in @('Copy-Item','Remove-Item','Move-Item','Start-Process','Stop-Process','Set-ItemProperty','Set-Content','Add-Content','WriteAllBytes')){
            if($source -match ('(?im)^\s*'+[regex]::Escape($mutator)+'\b')){throw 'One-shot source unexpectedly mutates host'}
          }
          New-Item -ItemType Directory -Path artifacts/numeric -Force | Out-Null
          $sdkBin=$env:C545D_ONE_SHOT_SDK_BIN
          $candidate=(Resolve-Path artifacts/core-rc/gio-2.0-0.dll).Path
          $candidateManifest=(Resolve-Path artifacts/core-rc/manifest.txt).Path
          $graphManifest=(Resolve-Path docs/CORE_GIO_SDK_1288_REFERENCE.json).Path
          $beforeCandidate=(Get-FileHash $candidate -Algorithm SHA256).Hash
          $beforeGio=(Get-FileHash (Join-Path $sdkBin 'gio-2.0-0.dll') -Algorithm SHA256).Hash
          if($beforeCandidate -ne '67B9F7246E4744FEF7EE1EAD3BED4CE2179C6F0465EC68A92D01DD12B4A3CCAD' -or
             $beforeGio -ne 'A875107C180FB248236D1E96E14F362F117124DF2FEE1237FA2142B7B363941B'){
            throw 'Unexpected official SDK or candidate input'
          }
          function Check([string]$label,[string]$bin,[string]$dll,[string]$ref,[string]$expected){
            $out=@(& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/Test-C545DCoreGioOneShotReadOnly.ps1 -GStreamerBin $bin -CandidateDll $dll -CandidateManifest $candidateManifest -CoreReferenceManifest $ref)
            $code=$LASTEXITCODE
            if($code -ne 3 -or $out.Count -ne 1){
              throw "Not fail-closed for $label"
            }
            if($out[0] -notmatch ('^C545D_ONE_SHOT_GIO_READONLY,'+$expected+'$') -or
               $out[0] -notmatch 'read_only_eligible=0,install_approved=0,smoke_authorized=0,'){
              throw "Wrong one-shot numeric condition for $label"
            }
            $out[0] | Add-Content artifacts/numeric/one_shot_results.txt
          }
          $core='preflight_valid=1,graph_valid=1,preflight_exit=3,graph_exit=0,candidate_consistent=1,reference_consistent=1,graph_match=1,recorder_active=0,windows10=0,read_only_eligible=0,install_approved=0,smoke_authorized=0,reason=WIN10_NOT_VERIFIED'
          Check 'matching_sdk_still_not_win10' $sdkBin $candidate $graphManifest $core
          $badCandidate=Join-Path $env:RUNNER_TEMP 'one-shot-bad-candidate.dll'
          Copy-Item $candidate $badCandidate
          $f=[IO.File]::Open($badCandidate,[IO.FileMode]::Append)
          try{$f.WriteByte(0)}finally{$f.Dispose()}
          Check 'tampered_candidate' $sdkBin $badCandidate $graphManifest 'preflight_valid=1,graph_valid=1,preflight_exit=3,graph_exit=3,candidate_consistent=0,reference_consistent=1,graph_match=0,recorder_active=0,windows10=0,read_only_eligible=0,install_approved=0,smoke_authorized=0,reason=CANDIDATE_NOT_QUALIFIED'
          $files=@('gio-2.0-0.dll','glib-2.0-0.dll','gobject-2.0-0.dll','gmodule-2.0-0.dll','intl-8.dll','z-1.dll','gst-launch-1.0.exe','gst-inspect-1.0.exe')
          $unknown=Join-Path $env:RUNNER_TEMP 'one-shot-unknown-copy'
          New-Item -ItemType Directory -Path $unknown -Force | Out-Null
          foreach($name in $files){Copy-Item (Join-Path $sdkBin $name) $unknown}
          $f=[IO.File]::Open((Join-Path $unknown 'glib-2.0-0.dll'),[IO.FileMode]::Append)
          try{$f.WriteByte(0)}finally{$f.Dispose()}
          Check 'modified_glib_dependency' $unknown $candidate $graphManifest 'preflight_valid=1,graph_valid=1,preflight_exit=3,graph_exit=3,candidate_consistent=1,reference_consistent=0,graph_match=0,recorder_active=0,windows10=0,read_only_eligible=0,install_approved=0,smoke_authorized=0,reason=UNKNOWN_INSTALLED_RUNTIME'
          $missing=Join-Path $env:RUNNER_TEMP 'one-shot-missing-copy'
          New-Item -ItemType Directory -Path $missing -Force | Out-Null
          foreach($name in $files | Where-Object {$_ -ne 'intl-8.dll'}){Copy-Item (Join-Path $sdkBin $name) $missing}
          Check 'missing_intl_dependency' $missing $candidate $graphManifest 'preflight_valid=1,graph_valid=1,preflight_exit=3,graph_exit=3,candidate_consistent=1,reference_consistent=0,graph_match=0,recorder_active=0,windows10=0,read_only_eligible=0,install_approved=0,smoke_authorized=0,reason=MISSING_INPUT'
          # The only fake recorder process is a disposable copy of the
          # built-in ping binary named gst-launch-1.0.exe on this CI runner.
          $sentinel=Join-Path $env:RUNNER_TEMP 'gst-launch-1.0.exe'
          Copy-Item (Join-Path $env:SystemRoot 'System32\PING.EXE') $sentinel
          $fake=$null
          try {
            $fake=Start-Process -FilePath $sentinel -ArgumentList @('-n','30','127.0.0.1') -PassThru -WindowStyle Hidden
            Start-Sleep -Milliseconds 350
            Check 'recorder_process_active' $sdkBin $candidate $graphManifest 'preflight_valid=1,graph_valid=1,preflight_exit=3,graph_exit=0,candidate_consistent=1,reference_consistent=1,graph_match=1,recorder_active=1,windows10=0,read_only_eligible=0,install_approved=0,smoke_authorized=0,reason=RECORDER_ACTIVE'
          } finally {
            if($fake){
              if(-not $fake.HasExited){Stop-Process -Id $fake.Id -Force -ErrorAction SilentlyContinue}
              $fake.Dispose()
            }
          }
          if((Get-Content artifacts/numeric/one_shot_results.txt).Count -ne 5){throw 'Incomplete one-shot safety conditions'}
          if((Get-FileHash $candidate -Algorithm SHA256).Hash -ne $beforeCandidate -or
             (Get-FileHash (Join-Path $sdkBin 'gio-2.0-0.dll') -Algorithm SHA256).Hash -ne $beforeGio){
            throw 'Candidate or SDK was modified'
          }
          Write-Host 'C545D_ONE_SHOT_READONLY_CI_PASS,matching_server_blocked=1,bad_candidate_blocked=1,modified_dependency_blocked=1,missing_dependency_blocked=1,active_recorder_blocked=1,source_mutators=0,recording_host_modified=0'
          $global:LASTEXITCODE=0
          exit 0
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: c545d-gio-one-shot-readonly-five-scenarios-numeric-only
          path: artifacts/numeric/one_shot_results.txt
          retention-days: 7
          if-no-files-found: error
