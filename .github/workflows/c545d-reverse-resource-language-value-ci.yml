name: C545D reverse-language real MSIX original getter eligibility probe (CI ONLY)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-reverse-language-only:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Validate reverse-mode synthetic fixture scripts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          py -m py_compile tests/make_c545d_ci_package_fixture.py tests/make_c545d_ci_resource_package_fixture.py
          if($LASTEXITCODE -ne 0){throw 'Python fixture compile failed'}
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path tests/Invoke-C545DResourcePackageEventCI.ps1).Path,
            [ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count -gt 0) {throw 'MSIX resource CI PowerShell syntax error'}
      - name: Compile original WinRT getter probe and disposable PackageCatalog watcher
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          & cl.exe /nologo /W4 /MD /O2 tests/c545d_ci_package_noop.c /Fe:artifacts/c545d_ci_noop.exe /link /SUBSYSTEM:WINDOWS
          if($LASTEXITCODE -ne 0){throw 'Synthetic no-op MSIX entry-point build failed'}
          & cl.exe /nologo /std:c++17 /EHsc /W4 /MD /O2 tests/c545d_ci_localized_pkg_display_probe.cpp /Fe:artifacts/c545d_ci_localized_pkg_display_probe.exe /link windowsapp.lib runtimeobject.lib
          if($LASTEXITCODE -ne 0){throw 'Original WinRT getter probe build failed'}
          py tests/patch_c545d_winrt_spontaneous_listener_ci.py tests/c545d_winrt_dedicated_watch.cpp
          if($LASTEXITCODE -ne 0){throw 'Native sink patch failed'}
          py tests/patch_c545d_winrt_status_only_listener_ci.py tests/c545d_winrt_dedicated_watch.cpp
          if($LASTEXITCODE -ne 0){throw 'Status-only native sink patch failed'}
          & cl.exe /nologo /std:c++17 /EHsc /W4 /MD /O2 /LD tests/c545d_winrt_dedicated_watch.cpp /Fe:artifacts/c545d_dedicated_watch.dll /link /IMPLIB:artifacts/c545d_dedicated_watch.lib windowsapp.lib runtimeobject.lib
          if($LASTEXITCODE -ne 0){throw 'Native watcher build failed'}
      - name: Assert real en-US resource language with unchanged fr-FR parent FullName
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $watch=(Resolve-Path artifacts/c545d_dedicated_watch.dll).Path
          $stub=(Resolve-Path artifacts/c545d_ci_noop.exe).Path
          $probe=(Resolve-Path artifacts/c545d_ci_localized_pkg_display_probe.exe).Path
          $raw='artifacts/reverse_raw_private.txt'
          $numeric='artifacts/reverse_numeric_ci_only.txt'
          try {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/Invoke-C545DResourcePackageEventCI.ps1 -WatchDll $watch -StubExe $stub -LocalizedProbeExe $probe -AssertLocalizedDisplayName -ReverseResourceLanguage *> $raw
            if($LASTEXITCODE -ne 0){throw "Reverse resource value assertion failed, exit=$LASTEXITCODE"}
          } finally {
            # Do not upload raw package installer logs or environment.
            if(Test-Path -LiteralPath $raw) {
              Get-Content -LiteralPath $raw | Where-Object {
                $_ -match '^(C545D_RESOURCE_NAME_REVERSE,|C545D_RESOURCE_NAME_INCONCLUSIVE,|C545D_RESOURCE_(OS_ADD_OBSERVATION|OS_REMOVE_OBSERVATION|PACKAGE_PROBE_COMPLETE),|C545D_RESOURCE_CI_CLEANUP_EXECUTED=)'
              } | Set-Content -LiteralPath $numeric -Encoding utf8
            }
            Remove-Item -LiteralPath $raw -Force -ErrorAction SilentlyContinue
          }
          $data=Get-Content -LiteralPath $numeric
          $rows=@($data | Where-Object {$_ -match '^C545D_RESOURCE_NAME_REVERSE,'})
          if($rows.Count -ne 3){throw "Expected 3 original WinRT getter stages, got $($rows.Count)"}
          if(@($rows | Where-Object {$_ -notmatch 'expected=1,'}).Count){throw 'WinRT language value not fresh'}
          if(@($data | Where-Object {$_ -match '^C545D_RESOURCE_CI_CLEANUP_EXECUTED=1,runner_only=1$'}).Count -ne 1){throw 'MSIX cleanup unverified'}
          Write-Output 'C545D_REVERSE_WINRT_VALUE_PASS,stages=3,real_signed_msix=1,parent_unchanged=1,host_install=0'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c545d-reverse-language-WinRT-numeric-only
          path: artifacts/reverse_numeric_ci_only.txt
          retention-days: 7
          if-no-files-found: warn
