name: C545D synthetic-only cache refresh analyzer regression

on:
  push:
    branches:
      - investigate/c545d-display-cache-invalidation-20261119
    paths:
      - tests/analyze_gio_cache_refresh.py
      - tests/test_analyze_gio_cache_refresh.py
      - .github/workflows/c545d-cache-refresh-analyzer-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyzer-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test control-vs-registry, null refetch and handle growth gates
        run: python -m unittest -v tests/test_analyze_gio_cache_refresh.py
