name: C545D closed media metadata prototype (CI only)
on:
  push:
    branches: ['investigate/c545d-status-only-monitor-20261120']
    paths:
      - 'tests/C545D-ClosedMetadataPrototype.ps1'
      - 'tests/C545DClosedProbePrototype.cs'
      - 'tests/Test-C545DNamerSingleProbe.ps1'
      - 'tests/Test-C545DNamerWriterLifecycle.ps1'
      - 'tests/C545DMetadataWriterPrototype.cs'
      - 'SegmentNamerWorker.ps1'
      - 'diagnostics/C545D*V04*'
      - 'tests/Test-C545DV04ActualNamer.ps1'
      - 'tests/C545DMetadataJournalPrototype.cs'
      - 'tests/Read-C545DMetadataJournalFixture.ps1'
      - 'SegmentNamer.ps1'
      - '.github/workflows/c545d-closed-metadata-prototype-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata-only:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate strict metadata classifier and synthetic closed MP4
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          . ./tests/C545D-ClosedMetadataPrototype.ps1
          Test-C545DMetadataEvidence
          # Pinned, hash-verified synthetic-test dependency; no Chocolatey feed or shim.
          # Source: Microsoft winget-pkgs Gyan.FFmpeg 7.1.1 installer manifest.
          $archive=Join-Path $env:RUNNER_TEMP 'c545d-ffmpeg-7.1.1.zip'
          $toolsDir=Join-Path $env:RUNNER_TEMP 'c545d-ffmpeg-7.1.1'
          $url='https://github.com/GyanD/codexffmpeg/releases/download/7.1.1/ffmpeg-7.1.1-full_build.zip'
          $sha='D760E1B3574402ED18B4865851F87D87E73965A982E6453212DF8621FED1C508'
          & curl.exe --fail --location --retry 2 --retry-delay 2 --max-time 180 --output $archive $url
          if($LASTEXITCODE -ne 0){throw 'PINNED_FFMPEG_DOWNLOAD_FAILED'}
          if((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $sha){throw 'PINNED_FFMPEG_HASH_MISMATCH'}
          Expand-Archive -LiteralPath $archive -DestinationPath $toolsDir
          $bin=Join-Path $toolsDir 'ffmpeg-7.1.1-full_build\bin'
          $ffmpeg=Get-Command (Join-Path $bin 'ffmpeg.exe') -ErrorAction Stop
          $ffprobe=Get-Command (Join-Path $bin 'ffprobe.exe') -ErrorAction Stop
          Write-Host 'C545D_PINNED_FFMPEG_VERIFIED,version=7.1.1,archive_sha256_match=1,direct_exe=1'
          $dir=Join-Path $env:RUNNER_TEMP 'c545d-closed-metadata-fixtures'
          New-Item -ItemType Directory -Path $dir -ErrorAction Stop | Out-Null
          $ok=Join-Path $dir 'composite.mp4'
          $noAudio=Join-Path $dir 'no-audio.mp4'
          $bad=Join-Path $dir 'broken.mp4'
          # Only freshly generated disposable fixtures; never a recording directory.
          & $ffmpeg.Source -nostdin -v error -f lavfi -i 'color=c=blue:s=2560x720:r=15' -f lavfi -i 'sine=frequency=440:sample_rate=48000' -t 1 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -ac 1 -ar 48000 $ok
          if($LASTEXITCODE -ne 0){throw 'GENERATE_FIXTURE_FAILED'}
          & $ffmpeg.Source -nostdin -v error -i $ok -map 0:v:0 -c copy $noAudio
          if($LASTEXITCODE -ne 0){throw 'GENERATE_NO_AUDIO_FAILED'}
          [IO.File]::WriteAllBytes($bad,[byte[]](1,2,3,4))
          function Read-Fixture([string]$path){
            $json= & $ffprobe.Source -v quiet -protocol_whitelist file -f mov -show_entries 'stream=codec_type,codec_name,width,height,avg_frame_rate,sample_rate,channels:format=duration' -of json -i $path
            $exit=$LASTEXITCODE
            ConvertTo-C545DMetadataEvidence ($json -join [Environment]::NewLine) $exit
          }
          $row=Read-Fixture $ok
          if($row.metadata_status -ne 'profile_match_metadata_only' -or $row.duration_ms -lt 900 -or $row.duration_ms -gt 1200){throw 'REAL_FIXTURE_METADATA_FAILED'}
          if((Read-Fixture $noAudio).metadata_status -ne 'profile_mismatch'){throw 'MISSING_AUDIO_ACCEPTED'}
          if((Read-Fixture $bad).metadata_status -ne 'probe_failed'){throw 'BROKEN_CONTAINER_ACCEPTED'}
          $global:LASTEXITCODE=0
          Write-Host 'C545D_CLOSED_METADATA_FIXTURES_PASS,valid=1,no_audio_rejected=1,invalid_container_rejected=1,real_camera=0,composition_proven=0,release_HOLD=1'

          # CI-only closed-file gate; never invoke for actual user recordings.
          Add-Type -Path (Resolve-Path tests/C545DClosedProbePrototype.cs).Path
          $leaf='2026-11-24_12-00_12-01.mp4'
          $final=Join-Path $dir $leaf
          Move-Item -LiteralPath $ok -Destination $final
          $before=(Get-FileHash -LiteralPath $final -Algorithm SHA256).Hash
          function Assert-Probe($result,[string]$status,[int]$started){
            if($result.Status -ne $status -or $result.Started -ne $started){
              throw ('CLOSED_PROBE_UNEXPECTED_STATUS='+$result.Status+';expected='+$status)
            }
            if($started -eq 1 -and $result.ChildExited -ne 1){throw 'CHILD_CLEANUP_UNCONFIRMED'}
            if($status -ne 'ok' -and $result.Json -ne ''){throw 'RAW_ERROR_OUTPUT_RETAINED'}
          }
          $p=[C545DClosedProbePrototype]::ProbeFinalized($dir,$leaf,$true,$ffprobe.Source,4000)
          Assert-Probe $p 'ok' 1
          if((ConvertTo-C545DMetadataEvidence $p.Json $p.ExitCode).metadata_status -ne 'profile_match_metadata_only'){throw 'LEASED_METADATA_INVALID'}
          Assert-Probe ([C545DClosedProbePrototype]::ProbeFinalized($dir,$leaf,$false,$ffprobe.Source,4000)) 'no_rename_evidence' 0
          foreach($name in @(('..\'+$leaf),'C545D_PENDING_20261124_120000_12345678_00001.mp4',($leaf+':stream'),'https://example.invalid/a.mp4')){
            Assert-Probe ([C545DClosedProbePrototype]::ProbeFinalized($dir,$name,$true,$ffprobe.Source,4000)) 'name_rejected' 0
          }
          Assert-Probe ([C545DClosedProbePrototype]::ProbeFinalized('\\example.invalid\share',$leaf,$true,$ffprobe.Source,4000)) 'root_rejected' 0
          Assert-Probe ([C545DClosedProbePrototype]::ProbeFinalized($dir,$leaf,$true,(Join-Path $dir 'ffprobe.exe'),4000)) 'probe_unavailable' 0
          Assert-Probe ([C545DClosedProbePrototype]::ProbeFinalized($dir,'2026-11-24_13-00_13-01.mp4',$true,$ffprobe.Source,4000)) 'missing_file' 0
          $lock=[IO.File]::Open($final,[IO.FileMode]::Open,[IO.FileAccess]::Write,[IO.FileShare]::ReadWrite)
          try{
            Assert-Probe ([C545DClosedProbePrototype]::ProbeFinalized($dir,$leaf,$true,$ffprobe.Source,4000)) 'file_busy_or_unavailable' 0
          }finally{$lock.Dispose()}
          $junction=Join-Path $dir 'junction'
          New-Item -ItemType Junction -Path $junction -Target $dir -ErrorAction Stop | Out-Null
          try{
            Assert-Probe ([C545DClosedProbePrototype]::ProbeFinalized($junction,$leaf,$true,$ffprobe.Source,4000)) 'root_rejected' 0
          }finally{[IO.Directory]::Delete($junction)}
          if((Get-FileHash -LiteralPath $final -Algorithm SHA256).Hash -ne $before){throw 'MEDIA_CHANGED'}
          # Direct subprocess tests: both pipes exceed ordinary pipe capacity,
          # no unbounded capture, no blocking WaitForExit before draining.
          $ps=(Get-Command powershell.exe).Source
          function Run-Synthetic([string]$code,[int]$ms){
            $b64=[Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($code))
            [C545DClosedProbePrototype]::RunBounded($ps,('-NoProfile -NonInteractive -EncodedCommand '+$b64),$ms)
          }
          $dual=Run-Synthetic '[Console]::Out.Write(("x"*40000));[Console]::Error.Write(("y"*40000));exit 0' 5000
          Assert-Probe $dual 'ok' 1
          if($dual.Json.Length -ne 40000){throw 'STDOUT_TRUNCATED'}
          Assert-Probe (Run-Synthetic '[Console]::Out.Write(("x"*100000));exit 0' 5000) 'output_limit' 1
          Assert-Probe (Run-Synthetic '[Console]::Error.Write(("x"*100000));exit 0' 5000) 'output_limit' 1
          Assert-Probe (Run-Synthetic 'Start-Sleep -Seconds 20;exit 0' 1000) 'timeout' 1
          Assert-Probe (Run-Synthetic 'exit 7' 5000) 'probe_failed' 1
          Write-Host 'C545D_CLOSED_PROBE_SAFETY_PASS,real_fixture=1,locked=1,path_rejections=5,junction=1,media_hash_unchanged=1,dual_pipe=1,overflow=2,timeout=1,child_cleanup=1,host_modified=0'

          & ./tests/Test-C545DNamerSingleProbe.ps1 -FixtureDirectory $dir -ProbeExe $ffprobe.Source

      - name: Verify actual release candidate activation and fallback
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP 'c545d-closed-metadata-fixtures'
          $probe=Join-Path $env:RUNNER_TEMP 'c545d-ffmpeg-7.1.1\ffmpeg-7.1.1-full_build\bin\ffprobe.exe'
          & ./tests/Test-C545DV04ActualNamer.ps1 -FixtureDirectory $dir -ProbeExe $probe

      - name: Verify prototype watcher lifecycle independently
        if: success() || failure()
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP 'c545d-closed-metadata-fixtures'
          $probe=Join-Path $env:RUNNER_TEMP 'c545d-ffmpeg-7.1.1\ffmpeg-7.1.1-full_build\bin\ffprobe.exe'
          if(-not(Test-Path -LiteralPath (Join-Path $dir '2026-11-24_12-00_12-01.mp4')) -or -not(Test-Path -LiteralPath $probe)){
            throw 'LIFECYCLE_FIXTURE_UNAVAILABLE'
          }
          & ./tests/Test-C545DNamerWriterLifecycle.ps1 -FixtureDirectory $dir -ProbeExe $probe
