name: C545D GUI worker Ctrl+C console baseline Windows CI ONLY
on:
  push:
    branches: ['investigate/c545d-status-only-monitor-20261120']
    paths:
      - '.github/workflows/c545d-console-stop-baseline-ci.yml'
      - 'tests/Assert-C545DConsoleStopCI.ps1'
      - 'C545D_App.ps1'
      - 'RecordGUIWorker.ps1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  console-signal-no-camera:
    runs-on: windows-2022
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Parse script and exercise actual Ctrl+C handler in isolated Windows console
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $script=(Resolve-Path tests/Assert-C545DConsoleStopCI.ps1).Path
          $tokens=$null;$errors=$null
          [Management.Automation.Language.Parser]::ParseFile($script,[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count -ne 0){throw 'Ctrl+C CI source syntax invalid'}
          $rows=@(& pwsh -NoProfile -NonInteractive -File $script 2>$null)
          foreach($row in $rows){
            if(([string]$row) -cmatch '^C545D_CONSOLE_STOP_BASELINE_FAIL,phase=[A-Z_]+,reason=[A-Z_]+,real_camera=0,host_modified=0$'){
              Write-Host $row
            }
          }
          $expected='C545D_CONSOLE_STOP_BASELINE_PASS,source_worker_handler_exact=1,gui_stop_order=1,marker_before_event=1,ctrlc_event=1,worker_survived_ctrlc=1,owned_rollback=1,real_recorder_executed=0,real_camera=0,install_approved=0'
          if($LASTEXITCODE -ne 0 -or $rows.Count -ne 1 -or $rows[0] -cne $expected){
            throw 'CI-only GUI console signal test not qualified'
          }
          Write-Host $expected
