name: C545D exact original DisplayName cache 512-cycle plateau verification

on:
  push:
    branches: ['investigate/c545d-last-residual-slope-20261120']
    paths:
      - 'tests/analyze_gio_cache_512_plateau.py'
      - '.github/workflows/c545d-gio-cache-512-plateau-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache-512:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-pcre2
            mingw-w64-x86_64-libffi
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-gettext
            mingw-w64-x86_64-python
      - name: Build GLib 2.82.4 with existing exact original DisplayName cache, no changed recording behavior
        shell: msys2 {0}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 2.82.4 https://github.com/GNOME/glib.git glib-src
          python tests/patch_glib_appinfo_weak_backrefs.py glib-src/gio/gwin32appinfo.c
          python tests/patch_glib_registry_owned_path.py glib-src/gio/gwin32registrykey.c
          python tests/patch_glib_uwp_api_isolation.py glib-src/gio/gwin32appinfo.c glib-src/gio/gwin32packageparser.c
          python tests/patch_glib_uwp_displayname_cache_diagnostic.py glib-src/gio/gwin32packageparser.c
          git -C glib-src diff --check
          meson setup glib-build glib-src -Dglib_debug=enabled -Dtests=false -Dintrospection=disabled -Ddocumentation=false -Dman-pages=disabled -Ddefault_library=shared
          meson compile -C glib-build
          python - <<'PY'
          from pathlib import Path
          source=Path("tests/gio_appinfo_key_handle_probe.c").read_text(encoding="utf-8")
          old='else if (strcmp(argv[arg], "--cycles=256") == 0) cycle_count = 256;'
          assert source.count(old)==1, "Must retain exact 256-cycle branch and add 512"
          source=source.replace(old,old+'\n        else if (strcmp(argv[arg], "--cycles=512") == 0) cycle_count = 512;')
          Path("glib-build/gio_appinfo_probe_512.c").write_text(source,encoding="utf-8")
          PY
          meson devenv -C glib-build sh -c 'gcc -O2 -Wall -Wextra -o gio_appinfo_probe_512.exe gio_appinfo_probe_512.c $(pkg-config --cflags --libs gio-2.0) -lpsapi -ladvapi32'
          mkdir -p artifacts
      - name: Measure paired unchanged-registry and changing-registry 512 cycles, report every 64
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export GOBJECT_DEBUG=instance-count C545D_DIAG_UWP_CACHE_DISPLAYNAME=1
          unset C545D_DIAG_UWP_SKIP_CURRENT C545D_DIAG_UWP_NO_DISPLAYNAME_GETTER C545D_DIAG_UWP_CACHE_REFRESH_EVERY C545D_DIAG_UWP_CACHE_EVENT_BRIDGE || true
          for scope in nochange registry; do
            args=(--cycles=512 --heap-summary --vm-summary --report-types)
            if [ "$scope" = nochange ]; then args+=(--no-registry-change); fi
            echo "C545D_CACHE512_START,scope=$scope"
            meson devenv -C glib-build "$PWD/glib-build/gio_appinfo_probe_512.exe" "${args[@]}" > "artifacts/cache_${scope}_512.log"
            grep -q 'GIO_PROBE_DONE,cycles=512' "artifacts/cache_${scope}_512.log"
            echo "C545D_CACHE512_COMPLETE,scope=$scope"
          done
      - name: Analyze late 256-cycle slope and handle stability
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          py tests/analyze_gio_cache_512_plateau.py | Tee-Object -FilePath artifacts/cache512_summary.txt
          if ($LASTEXITCODE -ne 0) { throw '512-cycle residual slope analyzer failed' }
          Get-Content artifacts/cache_512_aggregate.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c545d-cache512-numeric-aggregate-only
          path: |
            artifacts/cache512_summary.txt
            artifacts/cache_512_aggregate.csv
          retention-days: 7
          if-no-files-found: warn
