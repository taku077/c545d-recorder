name: C545D production mirror runtime script fast PowerShell syntax CI ONLY
on:
  push:
    branches: ['investigate/c545d-status-only-monitor-20261120']
    paths:
      - '.github/workflows/c545d-production-mirror-runtime-fast-ci.yml'
      - 'tests/Assert-C545DProductionMirrorRealSdkCI.ps1'
      - 'tests/Assert-GStreamerOverlaySplitMux.ps1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  powershell-parse-only:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Independently parse Windows PowerShell 5.1 and PowerShell 7 before SDK install
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $script=(Resolve-Path tests/Assert-C545DProductionMirrorRealSdkCI.ps1).Path
          $ps51=Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          foreach($ps in @($ps51,(Get-Command pwsh).Source)){
            $check='param([string]$source);$tokens=$null;$errors=$null;[Management.Automation.Language.Parser]::ParseFile($source,[ref]$tokens,[ref]$errors)|Out-Null;if($errors.Count -ne 0){exit 3};exit 0'
            & $ps -NoProfile -NonInteractive -Command $check -source $script
            if($LASTEXITCODE -ne 0){throw 'Cross-PowerShell integrated runtime source parse failed'}
          }
          $text=[IO.File]::ReadAllText($script)
          foreach($required in @('Get-FileHash','Get-Process','gio-2.0-0.dll','GST_REGISTRY','GST_PLUGIN_PATH_1_0','Assert-GStreamerOverlaySplitMux.ps1','New-C545DIsolatedProductionMirrorCI.ps1','New-C545DPrivateOutputSettingsMirrorCI.ps1','Get-ChildItem','Remove-Item','real_tapo_tested=0','install_approved=0')){
            if(-not $text.Contains($required)){throw 'Required app-local safety/media invariant missing'}
          }
          if($text -match '(?im)^\s*(?:Stop-Process|Set-ItemProperty|Remove-ItemProperty|Invoke-RestMethod)\b'){
            throw 'Unsafe production host operation in CI-only script'
          }
          Write-Host 'C545D_PRODUCTION_MIRROR_RUNTIME_FAST_CI_PASS,powershell51_parse=1,powershell7_parse=1,only_disposable_runner=1,live_tapo_executed=0,install_approved=0'
