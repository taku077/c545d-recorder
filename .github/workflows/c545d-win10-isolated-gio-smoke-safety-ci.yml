name: C545D future Win10 app-local GIO smoke safety CI ONLY
on:
  push:
    branches: ['investigate/c545d-status-only-monitor-20261120']
    paths:
      - 'tools/Invoke-C545DWin10IsolatedGioSmoke.ps1'
      - 'tools/Get-C545DGStreamerHostFingerprintReadOnly.ps1'
      - 'docs/CORE_GIO_SDK_1288_REFERENCE.json'
      - '.github/workflows/c545d-win10-isolated-gio-smoke-safety-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  camera-free-isolation:
    runs-on: windows-2022
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: c545d-core-only-gio-2824-msvc-ci-not-for-install
          repository: taku077/c545d-recorder
          run-id: 44757713497
          github-token: ${{ github.token }}
          path: artifacts/candidate
      - name: Install exact reference SDK on disposable runner
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          $sdk=Join-Path $env:RUNNER_TEMP 'gstreamer-1.28.8'
          $installer=Join-Path $env:RUNNER_TEMP 'gstreamer-1.28.8-installer.exe'
          Invoke-WebRequest 'https://gstreamer.freedesktop.org/data/pkg/windows/1.28.8/msvc/gstreamer-1.0-msvc-x86_64-1.28.8.exe' -OutFile $installer -TimeoutSec 180
          if((Get-Item $installer).Length -lt 15000000){throw 'Incomplete SDK installer'}
          $p=Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/TYPE=devel',"/DIR=$sdk") -Wait -PassThru
          if($p.ExitCode -ne 0){throw 'SDK setup failed'}
          "C545D_SMOKE_SDK=$sdk" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify real app-local GIO, rollback, and strict refusal cases
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $script='tools/Invoke-C545DWin10IsolatedGioSmoke.ps1'
          $tokens=$null;$errors=$null
          [Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script),[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count -gt 0){throw 'Host smoke PowerShell syntax errors'}
          $txt=Get-Content $script -Raw
          # Exercise the actual read-only cleanup gate function on disposable
          # Windows fixtures. Never recurse into or delete a junction target.
          $ast=[Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script).Path,[ref]$tokens,[ref]$errors)
          $nodes=@($ast.FindAll({param($node) $node -is [Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq 'Test-C545DStageHasNoReparse'},$true))
          if($nodes.Count -ne 1 -or -not $txt.Contains('(Test-C545DStageHasNoReparse -Root $stage)')){throw 'Test-owned cleanup guard missing'}
          . ([scriptblock]::Create($nodes[0].Extent.Text))
          $ownedFixture=Join-Path $env:RUNNER_TEMP 'c545d-cleanup-owned-fixture'
          $externalFixture=Join-Path $env:RUNNER_TEMP 'c545d-cleanup-external-sentinel'
          New-Item -ItemType Directory -Path $ownedFixture,$externalFixture -Force | Out-Null
          $sentinel=Join-Path $externalFixture 'DO_NOT_DELETE_THIS.txt'
          Set-Content -LiteralPath $sentinel -Value 'external file must survive' -Encoding ascii
          if(-not (Test-C545DStageHasNoReparse -Root $ownedFixture)){throw 'Ordinary owned tree unexpectedly rejected'}
          $junction=Join-Path $ownedFixture 'unexpected-junction'
          New-Item -ItemType Junction -Path $junction -Target $externalFixture -ErrorAction Stop | Out-Null
          if(Test-C545DStageHasNoReparse -Root $ownedFixture){throw 'Junction in owned tree was not rejected'}
          if(-not (Test-Path -LiteralPath $sentinel -PathType Leaf)){throw 'Outside sentinel changed'}
          Write-Host 'C545D_REPARSE_CLEANUP_GUARD_CI_PASS,normal_tree_allowed=1,junction_rejected=1,external_sentinel_unchanged=1'
          $gatePos=$txt.IndexOf('$phase=''SDK_INPUT_OK''')
          $compilerPos=$txt.IndexOf('Add-Type -TypeDefinition')
          if($gatePos -lt 0 -or $compilerPos -le $gatePos){throw 'Helper compilation must follow all no-run safety gates'}
          # Check ALL inherited plugin path overrides are suppressed while
          # the test child runs and that every prior value is remembered.
          foreach($key in @('GST_PLUGIN_PATH','GST_PLUGIN_PATH_1_0','GST_PLUGIN_SYSTEM_PATH')){
            if(-not $txt.Contains(("$"+"env:"+$key+"=''"))){throw "Inherited plugin path is not cleared: $key"}
            if(-not $txt.Contains("'"+$key+"'")){throw "Inherited plugin path is not saved: $key"}
          }
          foreach($forbidden in @('Stop-Process','Set-ItemProperty','Remove-ItemProperty','Set-Content','Invoke-WebRequest','Invoke-RestMethod')){
            if($txt -match ('(?im)^\s*'+[regex]::Escape($forbidden)+'\b')){throw "Host smoke forbidden operation: $forbidden"}
          }
          $orig=Join-Path $env:C545D_SMOKE_SDK 'bin\gio-2.0-0.dll'
          $ref=(Resolve-Path docs/CORE_GIO_SDK_1288_REFERENCE.json).Path
          $candidate=(Resolve-Path artifacts/candidate/gio-2.0-0.dll).Path
          $manifest=(Resolve-Path artifacts/candidate/manifest.txt).Path
          $sdkBin=Join-Path $env:C545D_SMOKE_SDK 'bin'
          $before=(Get-FileHash $orig -Algorithm SHA256).Hash
          $beforeCandidate=(Get-FileHash $candidate -Algorithm SHA256).Hash
          $ps=Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          New-Item -ItemType Directory artifacts/numeric -Force | Out-Null
          $blocked='C545D_GIO_ISOLATED_SMOKE,started=0,loaded_expected=0,wav_ok=0,exit_ok=0,rollback_ok=0,originals_unchanged=0,install_approved=0,live_tapo_authorized=0,reason=BLOCKED'
          $success='C545D_GIO_ISOLATED_SMOKE,started=1,loaded_expected=1,wav_ok=1,exit_ok=1,rollback_ok=1,originals_unchanged=1,install_approved=0,live_tapo_authorized=0,reason=CI_SYNTHETIC_PASS'
          function Check([string]$label,[string]$dll,[bool]$ci,[int]$expectExit,[string]$expected,[string]$testScript='',[string]$testManifest=''){
            if(-not $testScript){$testScript=$script}
            if(-not $testManifest){$testManifest=$manifest}
            $argv=@('-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File',$testScript,'-GStreamerBin',$sdkBin,'-CandidateDll',$dll,'-CandidateManifest',$testManifest,'-ReferenceManifest',$ref)
            if($ci){$argv+='-CiRunnerOnly'}
            $lines=@(& $ps @argv)
            if($LASTEXITCODE -ne $expectExit -or $lines.Count -ne 1 -or $lines[0] -cne $expected){
              Write-Host "C545D_SMOKE_CI_MISMATCH,exit_expected=$expectExit,exit_actual=$LASTEXITCODE,lines=$($lines.Count)"
              foreach($row in $lines){
                if(([string]$row).StartsWith('C545D_GIO_ISOLATED_SMOKE,')){
                  Write-Host $row
                }
              }
              throw "Wrong gate or numeric result for $label"
            }
            $lines[0] | Add-Content artifacts/numeric/isolated_smoke_ci_results.txt
          }
          Check 'Server rejected without runner-only test flag' $candidate $false 3 ($blocked.Replace('reason=BLOCKED','reason=HOST_NOT_ELIGIBLE'))
          $bad=Join-Path $env:RUNNER_TEMP 'invalid-candidate-copy.dll'
          Copy-Item $candidate $bad
          [IO.File]::AppendAllText($bad,'0')
          Check 'Corrupt candidate refused' $bad $true 3 ($blocked.Replace('reason=BLOCKED','reason=CANDIDATE_BAD'))
          # The release manifest is independently mandatory and must fail
          # before staging any executable or creating a private test process.
          $badManifest=Join-Path $env:RUNNER_TEMP 'candidate-invalid-manifest.txt'
          $m=Get-Content -LiteralPath $manifest -Raw
          $n=$m.Replace('C545D_RELEASE_CANDIDATE_STATUS=CI_TEST_ONLY_NOT_APPROVED_FOR_HOST','C545D_RELEASE_CANDIDATE_STATUS=NOT_QUALIFIED')
          if($n -ceq $m){throw 'Cannot construct manifest negative control'}
          [IO.File]::WriteAllText($badManifest,$n)
          Check 'Tampered candidate manifest refused' $candidate $true 3 ($blocked.Replace('reason=BLOCKED','reason=MANIFEST_BAD')) '' $badManifest
          # A checker returning exit0 and internally contradictory numeric
          # flags cannot ever authorize a smoke run. Synthetic checker is
          # isolated under RUNNER_TEMP; the real bundled checker is untouched.
          $fakeDir=Join-Path $env:RUNNER_TEMP 'c545d-false-fingerprint'
          New-Item -ItemType Directory -Path $fakeDir -Force | Out-Null
          $fakeSmoke=Join-Path $fakeDir 'Invoke-C545DWin10IsolatedGioSmoke.ps1'
          Copy-Item -LiteralPath $script -Destination $fakeSmoke
          $fakeCheck=@'
          Write-Output 'C545D_HOST_GIO_FINGERPRINT,manifest_valid=1,runtime_found=1,executables_found=1,dll_found=6,dll_hash_matched=6,gio_match=1,glib_match=0,gobject_match=1,gmodule_match=1,intl_match=1,zlib_match=1,dll_missing=0,pe64_failed=0,windows10=0,recorder_active=0,pinned_sdk_match=1,install_approved=0,live_test_authorized=0,reason=PINNED_SDK_MATCH_NON_WIN10'
          exit 0
          '@
          [IO.File]::WriteAllText((Join-Path $fakeDir 'Get-C545DGStreamerHostFingerprintReadOnly.ps1'),$fakeCheck)
          Check 'Contradictory fingerprint refused' $candidate $true 3 ($blocked.Replace('reason=BLOCKED','reason=HOST_NOT_ELIGIBLE')) $fakeSmoke
          $fakePath=Join-Path $env:RUNNER_TEMP 'gst-launch-1.0.exe'
          Copy-Item (Join-Path $env:SystemRoot 'System32\ping.exe') $fakePath
          $fake=$null
          try {
            $fake=Start-Process $fakePath -ArgumentList @('-n','45','127.0.0.1') -WindowStyle Hidden -PassThru
            Start-Sleep -Milliseconds 300
            Check 'Active synthetic recorder refused' $candidate $true 3 ($blocked.Replace('reason=BLOCKED','reason=HOST_NOT_ELIGIBLE'))
            if($fake.HasExited){throw 'Synthetic recorder exited early'}
          } finally {
            if($fake){
              if(-not $fake.HasExited){$fake.Kill();[void]$fake.WaitForExit(5000)}
              $fake.Dispose()
            }
          }
          # Test the dangerous startup gap: PowerShell GUI or recording
          # worker exists but gst-launch has not been launched yet. Every
          # fixture lives ONLY inside ephemeral GitHub RUNNER_TEMP, has no
          # RTSP, credentials or production code, and is cleaned as owned child.
          foreach($scriptName in @('C545D_App.ps1','RecordGUIWorker.ps1','Record.ps1')){
            $fakeWorkerPath=Join-Path $env:RUNNER_TEMP $scriptName
            if(Test-Path -LiteralPath $fakeWorkerPath){throw 'CI fixture path collision'}
            [IO.File]::WriteAllText($fakeWorkerPath,'Start-Sleep -Seconds 45',[Text.Encoding]::ASCII)
            $fakeWorker=$null
            try {
              $fakeWorker=Start-Process -FilePath $ps -ArgumentList @('-NoLogo','-NoProfile','-NonInteractive','-File',('"'+$fakeWorkerPath+'"')) -WindowStyle Hidden -PassThru
              Start-Sleep -Milliseconds 400
              if($fakeWorker.HasExited){throw 'CI worker-only fixture exited prematurely'}
              if(@(Get-Process -Name 'gst-launch-1.0','C545D_Recorder' -ErrorAction SilentlyContinue).Count -ne 0){
                throw 'CI PowerShell-only fixture unexpectedly includes a recorder executable'
              }
              Check ('PowerShell-only '+$scriptName+' refused before gst startup') $candidate $true 3 ($blocked.Replace('reason=BLOCKED','reason=RECORDER_ACTIVE'))
            } finally {
              if($fakeWorker){
                if(-not $fakeWorker.HasExited){$fakeWorker.Kill();[void]$fakeWorker.WaitForExit(5000)}
                $fakeWorker.Dispose()
              }
              if(Test-Path -LiteralPath $fakeWorkerPath){Remove-Item -LiteralPath $fakeWorkerPath -Force}
            }
          }
          # Positive case begins with deliberately hostile inherited plugin
          # search variables. The tested script must isolate and restore
          # these values without touching user/system environment settings.
          $polluted=Join-Path $env:RUNNER_TEMP 'c545d-untrusted-plugin-override'
          New-Item -ItemType Directory -Path $polluted -Force | Out-Null
          $oldPluginVars=@{}
          foreach($key in @('GST_PLUGIN_PATH','GST_PLUGIN_PATH_1_0','GST_PLUGIN_SYSTEM_PATH')){
            $oldPluginVars[$key]=[Environment]::GetEnvironmentVariable($key,'Process')
            [Environment]::SetEnvironmentVariable($key,$polluted,'Process')
          }
          try {
            Check 'Real app-local camera-free GIO trial ignores inherited plugin overrides' $candidate $true 0 $success
          } finally {
            foreach($key in $oldPluginVars.Keys){
              [Environment]::SetEnvironmentVariable($key,$oldPluginVars[$key],'Process')
            }
          }
          if((Get-FileHash $orig -Algorithm SHA256).Hash -ne $before -or (Get-FileHash $candidate -Algorithm SHA256).Hash -ne $beforeCandidate){throw 'Original binaries changed'}
          if((Get-Content artifacts/numeric/isolated_smoke_ci_results.txt).Count -ne 9){throw 'Missing numeric results'}
          Write-Host 'C545D_WIN10_FUTURE_SMOKE_CI_PASS,server_refused=1,tamper_refused=1,manifest_tamper_refused=1,contradictory_fingerprint_refused=1,active_recorder_refused=1,powershell_gui_pre_gst_refused=1,powershell_worker_pre_gst_refused=1,powershell_recorder_pre_gst_refused=1,real_app_local_gio_loaded=1,wav_valid=1,plugin_overrides_suppressed=1,rollback=1,originals_unchanged=1,real_win10_tested=0,live_tapo_authorized=0'
          exit 0
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: c545d-win10-future-isolated-smoke-camera-free-CI-only-results
          path: artifacts/numeric/isolated_smoke_ci_results.txt
          retention-days: 7
          if-no-files-found: error
