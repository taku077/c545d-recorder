name: C545D read-only running-recorder host SDK fingerprint one-click bundle CI ONLY
on:
  push:
    branches: ['investigate/c545d-status-only-monitor-20261120']
    paths:
      - '.github/workflows/c545d-host-fingerprint-readonly-standalone-ci.yml'
      - 'tools/Get-C545DGStreamerHostFingerprintReadOnly.ps1'
      - 'tools/RUN_C545D_HOST_FINGERPRINT_READONLY.cmd'
      - 'docs/CORE_GIO_SDK_1288_REFERENCE.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readonly-package-and-negatives:
    runs-on: windows-2022
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned official SDK only on a disposable runner
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          $sdk=Join-Path $env:RUNNER_TEMP 'gst-1.28.8'
          $installer=Join-Path $env:RUNNER_TEMP 'gst-1.28.8.exe'
          Invoke-WebRequest 'https://gstreamer.freedesktop.org/data/pkg/windows/1.28.8/msvc/gstreamer-1.0-msvc-x86_64-1.28.8.exe' -OutFile $installer -TimeoutSec 180
          if((Get-Item $installer).Length -lt 15000000){throw 'Incomplete official SDK'}
          $p=Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/TYPE=devel',"/DIR=$sdk") -Wait -PassThru
          if($p.ExitCode -ne 0){throw 'Official SDK setup failed'}
          "C545D_FINGERPRINT_SDK_BIN=$(Join-Path $sdk 'bin')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Check read-only implementation and five strict numeric Windows scenarios
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $script=(Resolve-Path tools/Get-C545DGStreamerHostFingerprintReadOnly.ps1).Path
          $tokens=$null;$parseErrors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($script,[ref]$tokens,[ref]$parseErrors) | Out-Null
          if($parseErrors.Count -gt 0){throw 'Read-only host fingerprint PowerShell syntax failed'}
          $source=Get-Content -LiteralPath $script -Raw
          foreach($mutator in @('Copy-Item','Remove-Item','Move-Item','Start-Process','Stop-Process','Set-ItemProperty','Set-Content','Add-Content','New-ItemProperty','Invoke-WebRequest','Invoke-RestMethod','Set-Location','New-Item','WriteAllBytes')){
            if($source -match ('(?im)^\s*'+[regex]::Escape($mutator)+'\b')){throw 'Host script performs forbidden mutation'}
          }
          New-Item -ItemType Directory -Path artifacts/numeric -Force | Out-Null
          $sdkBin=$env:C545D_FINGERPRINT_SDK_BIN
          $ref=(Resolve-Path docs/CORE_GIO_SDK_1288_REFERENCE.json).Path
          $sha0=(Get-FileHash (Join-Path $sdkBin 'gio-2.0-0.dll') -Algorithm SHA256).Hash
          function Check([string]$label,[string]$target,[string]$refManifest,[int]$code,[string]$expected){
            $lines=@(& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/Get-C545DGStreamerHostFingerprintReadOnly.ps1 -GStreamerBin $target -ReferenceManifest $refManifest)
            if($LASTEXITCODE -ne $code -or $lines.Count -ne 1){throw "Wrong numeric-only host inventory exit/row for $label"}
            if($lines[0] -cne $expected -or $lines[0] -notmatch 'install_approved=0,live_test_authorized=0'){
              throw "Unexpected read-only host inventory for $label"
            }
            $lines[0] | Add-Content artifacts/numeric/host_fingerprint_scenarios.txt
          }
          $prefix='C545D_HOST_GIO_FINGERPRINT,manifest_valid=1,runtime_found=1,executables_found=1,'
          Check 'official_sdk_non_win10' $sdkBin $ref 0 ($prefix+'dll_found=6,dll_hash_matched=6,gio_match=1,glib_match=1,gobject_match=1,gmodule_match=1,intl_match=1,zlib_match=1,dll_missing=0,pe64_failed=0,windows10=0,recorder_active=0,pinned_sdk_match=1,install_approved=0,live_test_authorized=0,reason=PINNED_SDK_MATCH_NON_WIN10')
          $names=@('gio-2.0-0.dll','glib-2.0-0.dll','gobject-2.0-0.dll','gmodule-2.0-0.dll','intl-8.dll','z-1.dll','gst-launch-1.0.exe','gst-inspect-1.0.exe')
          $bad=Join-Path $env:RUNNER_TEMP 'fingerprint-bad-glib-copy'
          New-Item -ItemType Directory -Path $bad -Force | Out-Null
          foreach($n in $names){Copy-Item (Join-Path $sdkBin $n) $bad}
          $handle=[IO.File]::Open((Join-Path $bad 'glib-2.0-0.dll'),[IO.FileMode]::Append)
          try{$handle.WriteByte(0)}finally{$handle.Dispose()}
          Check 'changed_runtime' $bad $ref 3 ($prefix+'dll_found=6,dll_hash_matched=5,gio_match=1,glib_match=0,gobject_match=1,gmodule_match=1,intl_match=1,zlib_match=1,dll_missing=0,pe64_failed=0,windows10=0,recorder_active=0,pinned_sdk_match=0,install_approved=0,live_test_authorized=0,reason=INSTALLED_RUNTIME_DIFFERS_FROM_PINNED_1288')
          $missing=Join-Path $env:RUNNER_TEMP 'fingerprint-missing-intl-copy'
          New-Item -ItemType Directory -Path $missing -Force | Out-Null
          foreach($n in $names | Where-Object {$_ -ne 'intl-8.dll'}){Copy-Item (Join-Path $sdkBin $n) $missing}
          Check 'missing_dependency' $missing $ref 3 ($prefix+'dll_found=5,dll_hash_matched=5,gio_match=1,glib_match=1,gobject_match=1,gmodule_match=1,intl_match=0,zlib_match=1,dll_missing=1,pe64_failed=0,windows10=0,recorder_active=0,pinned_sdk_match=0,install_approved=0,live_test_authorized=0,reason=SOME_DLLS_MISSING')
          # A syntactically valid but corrupted reference hash must never
          # redefine what "pinned 1.28.8" means. No user data is involved.
          $badManifest=Join-Path $env:RUNNER_TEMP 'fingerprint-tampered-reference.json'
          $json=Get-Content -LiteralPath $ref -Raw | ConvertFrom-Json
          $json.dll_sha256.'glib-2.0-0.dll'=('0'*64)
          $json | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $badManifest -Encoding utf8
          $incomplete='C545D_HOST_GIO_FINGERPRINT,manifest_valid=0,runtime_found=0,executables_found=0,dll_found=0,dll_hash_matched=0,gio_match=0,glib_match=0,gobject_match=0,gmodule_match=0,intl_match=0,zlib_match=0,dll_missing=0,pe64_failed=0,windows10=0,recorder_active=0,pinned_sdk_match=0,install_approved=0,live_test_authorized=0,reason=READ_ONLY_CHECK_INCOMPLETE'
          Check 'tampered_reference' $sdkBin $badManifest 3 $incomplete
          $fakeProc=Join-Path $env:RUNNER_TEMP 'gst-launch-1.0.exe'
          Copy-Item (Join-Path $env:SystemRoot 'System32\PING.EXE') $fakeProc
          $fake=$null
          try{
            $fake=Start-Process $fakeProc -ArgumentList @('-n','30','127.0.0.1') -PassThru -WindowStyle Hidden
            Start-Sleep -Milliseconds 300
            Check 'read_only_even_during_recorder' $sdkBin $ref 0 ($prefix+'dll_found=6,dll_hash_matched=6,gio_match=1,glib_match=1,gobject_match=1,gmodule_match=1,intl_match=1,zlib_match=1,dll_missing=0,pe64_failed=0,windows10=0,recorder_active=1,pinned_sdk_match=1,install_approved=0,live_test_authorized=0,reason=PINNED_SDK_MATCH_NON_WIN10')
          }finally{
            if($fake){
              if(-not $fake.HasExited){Stop-Process -Id $fake.Id -Force -ErrorAction SilentlyContinue}
              $fake.Dispose()
            }
          }
          if((Get-FileHash (Join-Path $sdkBin 'gio-2.0-0.dll') -Algorithm SHA256).Hash -ne $sha0){throw 'Original SDK GIO was modified'}
          if((Get-Content artifacts/numeric/host_fingerprint_scenarios.txt).Count -ne 5){throw 'Incomplete five-case inventory'}
          Write-Host 'C545D_HOST_FINGERPRINT_CI_PASS,matching_sdk=1,modified_glib_rejected=1,missing_intl_rejected=1,tampered_reference_rejected=1,running_recorder_untouched=1,local_hashes_suppressed=1,host_modified=0'
          $global:LASTEXITCODE=0
          exit 0
      - name: Package EXACTLY three source/reference files for future opt-in one-click read-only evaluation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $package=Join-Path (Resolve-Path artifacts).Path 'host-inventory-only'
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item tools/Get-C545DGStreamerHostFingerprintReadOnly.ps1 $package
          Copy-Item tools/RUN_C545D_HOST_FINGERPRINT_READONLY.cmd $package
          Copy-Item docs/CORE_GIO_SDK_1288_REFERENCE.json $package
          $names=@(Get-ChildItem $package -File | ForEach-Object {$_.Name} | Sort-Object)
          $expected=@('CORE_GIO_SDK_1288_REFERENCE.json','Get-C545DGStreamerHostFingerprintReadOnly.ps1','RUN_C545D_HOST_FINGERPRINT_READONLY.cmd')
          if(($names -join ',') -cne ($expected -join ',')){throw 'Unexpected package entries'}
          if(@(Get-ChildItem $package -Recurse -Include *.dll,*.exe,*.msi).Count -gt 0){throw 'No DLLs or EXEs may be distributed'}
          $archive=Join-Path (Resolve-Path artifacts).Path 'C545D_READONLY_HOST_CHECK_CI_NOT_FOR_INSTALL.zip'
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath $archive
          Write-Host 'C545D_READONLY_HOST_PACKAGE_CI_PASS,files=3,DLLs=0,EXEs=0,mutators=0,one_click=1,install_approved=0'
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: c545d-future-host-readonly-fingerprint-three-files-NOT-AN-INSTALLER
          path: |
            artifacts/C545D_READONLY_HOST_CHECK_CI_NOT_FOR_INSTALL.zip
            artifacts/numeric/host_fingerprint_scenarios.txt
          retention-days: 7
          if-no-files-found: error
