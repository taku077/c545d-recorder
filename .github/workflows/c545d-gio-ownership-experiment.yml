name: C545D isolate GLib 2.82.4 AppInfo ownership candidate

on:
  pull_request:
    paths:
      - 'tests/gio_appinfo_key_handle_probe.c'
      - 'tests/patch_glib_appinfo_experiment.py'
      - 'tests/gio_appinfo_retained_lifetime.c'
      - '.github/workflows/c545d-gio-ownership-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-probe:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-pcre2
            mingw-w64-x86_64-libffi
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-gettext
            mingw-w64-x86_64-python
      - name: Build unmodified GLib 2.82.4 and establish baseline
        shell: msys2 {0}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 2.82.4 https://github.com/GNOME/glib.git glib-src
          meson setup glib-build glib-src -Dtests=false -Dintrospection=disabled -Ddocumentation=false -Dman-pages=disabled -Ddefault_library=shared
          meson compile -C glib-build
          meson devenv -C glib-build -- sh -c 'gcc -O2 -Wall -Wextra -o gio_appinfo_probe.exe tests/gio_appinfo_key_handle_probe.c $(pkg-config --cflags --libs gio-2.0) -lpsapi -ladvapi32'
          meson devenv -C glib-build -- sh -c 'gcc -O2 -Wall -Wextra -o gio_appinfo_retained_lifetime.exe tests/gio_appinfo_retained_lifetime.c $(pkg-config --cflags --libs gio-2.0) -lpsapi -ladvapi32'
          mkdir -p artifacts
          meson devenv -C glib-build -- ./gio_appinfo_retained_lifetime.exe > artifacts/baseline_retained_lifetime.log
          meson devenv -C glib-build -- ./gio_appinfo_probe.exe --no-registry-change > artifacts/baseline_nochange.log
          meson devenv -C glib-build -- ./gio_appinfo_probe.exe > artifacts/baseline_regchange.log
          grep -q 'GIO_PROBE_DONE,cycles=16' artifacts/baseline_regchange.log
          grep '^GIO_PROBE,baseline\|^GIO_PROBE,after_cleanup' artifacts/baseline_regchange.log
      - name: Apply nonproduction ownership experiment and rebuild same source
        shell: msys2 {0}
        run: |
          set -euo pipefail
          python tests/patch_glib_appinfo_experiment.py glib-src/gio/gwin32appinfo.c
          meson compile -C glib-build
          set +e
          meson devenv -C glib-build -- ./gio_appinfo_retained_lifetime.exe > artifacts/patched_retained_lifetime.log 2>&1
          lifetime_exit=$?
          set -e
          echo "PATCHED_RETAINED_LIFETIME_EXIT=$lifetime_exit" > artifacts/lifetime_status.txt
          meson devenv -C glib-build -- ./gio_appinfo_probe.exe --no-registry-change > artifacts/patched_nochange.log
          meson devenv -C glib-build -- ./gio_appinfo_probe.exe > artifacts/patched_regchange.log
          grep -q 'GIO_PROBE_DONE,cycles=16' artifacts/patched_regchange.log
          grep '^GIO_PROBE,baseline\|^GIO_PROBE,after_cleanup' artifacts/patched_regchange.log
      - name: Compare before and after without hiding failure
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out=@()
          foreach($mode in @('baseline_nochange','baseline_regchange','patched_nochange','patched_regchange')) {
            $lines=@(Get-Content "artifacts/$mode.log")
            $b=@($lines | Where-Object {$_ -match '^GIO_PROBE,baseline,'})
            $e=@($lines | Where-Object {$_ -match '^GIO_PROBE,after_cleanup,'})
            if ($b.Count -ne 1 -or $e.Count -ne 1) { throw "Incomplete probe for $mode" }
            $before=$b[0].Split(',')
            $after=$e[0].Split(',')
            $out+= [pscustomobject]@{
              mode=$mode
              handle_before=[long]$before[4]
              handle_after=[long]$after[4]
              handle_delta=[long]$after[4]-[long]$before[4]
              private_before=[long]$before[5]
              private_after=[long]$after[5]
              private_delta=[long]$after[5]-[long]$before[5]
            }
          }
          $out | Export-Csv -Path artifacts/summary.csv -NoTypeInformation -Encoding utf8
          $out | Format-Table -AutoSize
          $b=$out | Where-Object mode -eq 'baseline_regchange'
          if ($b.handle_delta -le 300) {throw 'CI environment failed to reproduce prior handle growth, comparison inconclusive' }
          $p=$out | Where-Object mode -eq 'patched_regchange'
          if ($p.handle_delta -lt $b.handle_delta) {
             'DIAGNOSTIC_EFFECT=HANDLE_GROWTH_REDUCED;FUNCTIONAL_SAFETY_UNTESTED' | Out-File -FilePath artifacts/status.txt
          } else {
             'DIAGNOSTIC_EFFECT=NO_HANDLE_GROWTH_REDUCTION' | Out-File -FilePath artifacts/status.txt
          }
          Get-Content artifacts/status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gio-refcycle-baseline-vs-forced-dispose-experiment
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
