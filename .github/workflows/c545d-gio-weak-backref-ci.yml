name: C545D GLib 2.82.4 weak-backref ownership A/B

on:
  pull_request:
    paths:
      - 'tests/patch_glib_appinfo_weak_backrefs.py'
      - 'tests/patch_glib_registry_owned_path.py'
      - 'tests/gio_appinfo_key_handle_probe.c'
      - 'tests/gio_appinfo_retained_lifetime.c'
      - 'tests/gio_appinfo_public_api_regression.c'
      - '.github/workflows/c545d-gio-weak-backref-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-versus-weakrefs:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-pcre2
            mingw-w64-x86_64-libffi
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-gettext
            mingw-w64-x86_64-python

      - name: Compile GLib 2.82.4 unmodified and collect baseline
        shell: msys2 {0}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 2.82.4 https://github.com/GNOME/glib.git glib-src
          meson setup glib-build glib-src -Dglib_debug=enabled -Dtests=false -Dintrospection=disabled -Ddocumentation=false -Dman-pages=disabled -Ddefault_library=shared
          meson compile -C glib-build
          meson devenv -C glib-build sh -c 'gcc -O2 -Wall -Wextra -o gio_appinfo_probe.exe ../tests/gio_appinfo_key_handle_probe.c $(pkg-config --cflags --libs gio-2.0) -lpsapi -ladvapi32'
          meson devenv -C glib-build sh -c 'gcc -O2 -Wall -Wextra -o gio_appinfo_retained_lifetime.exe ../tests/gio_appinfo_retained_lifetime.c $(pkg-config --cflags --libs gio-2.0) -lpsapi -ladvapi32'
          meson devenv -C glib-build sh -c 'gcc -O2 -Wall -Wextra -o gio_appinfo_api_regression.exe ../tests/gio_appinfo_public_api_regression.c $(pkg-config --cflags --libs gio-2.0) -lpsapi -ladvapi32'
          mkdir -p artifacts
          git -C glib-src rev-parse HEAD > artifacts/glib_source_sha.txt
          export GOBJECT_DEBUG=instance-count
          meson devenv -C glib-build "$PWD/glib-build/gio_appinfo_retained_lifetime.exe" > artifacts/baseline_lifetime.log
          meson devenv -C glib-build "$PWD/glib-build/gio_appinfo_api_regression.exe" > artifacts/baseline_api.log
          grep -q 'GIO_API_PASS' artifacts/baseline_api.log
          meson devenv -C glib-build "$PWD/glib-build/gio_appinfo_probe.exe" --no-registry-change > artifacts/baseline_nochange.log
          meson devenv -C glib-build "$PWD/glib-build/gio_appinfo_probe.exe" --report-types > artifacts/baseline_registry.log
          grep -q 'GIO_PROBE_DONE,cycles=16' artifacts/baseline_registry.log
          grep -q 'C545D_RETAINED_APPINFO,PASS' artifacts/baseline_lifetime.log

      - name: Apply weak-backref source change and rebuild
        shell: msys2 {0}
        run: |
          set -euo pipefail
          python tests/patch_glib_appinfo_weak_backrefs.py glib-src/gio/gwin32appinfo.c
          git -C glib-src diff --check
          meson compile -C glib-build
          git -C glib-src diff -- gio/gwin32appinfo.c > artifacts/weak_backref_source.diff
          export GOBJECT_DEBUG=instance-count
          meson devenv -C glib-build "$PWD/glib-build/gio_appinfo_retained_lifetime.exe" > artifacts/patched_lifetime.log
          meson devenv -C glib-build "$PWD/glib-build/gio_appinfo_api_regression.exe" > artifacts/patched_api.log
          grep -q 'GIO_API_PASS' artifacts/patched_api.log
          meson devenv -C glib-build "$PWD/glib-build/gio_appinfo_probe.exe" --no-registry-change > artifacts/patched_nochange.log
          meson devenv -C glib-build "$PWD/glib-build/gio_appinfo_probe.exe" --report-types > artifacts/patched_registry.log
          grep -q 'GIO_PROBE_DONE,cycles=16' artifacts/patched_registry.log
          grep -q 'C545D_RETAINED_APPINFO,PASS' artifacts/patched_lifetime.log
          meson devenv -C glib-build "$PWD/glib-build/gio_appinfo_probe.exe" --cycles=64 --report-types > artifacts/patched_registry_64.log
          grep -q 'GIO_PROBE_DONE,cycles=64' artifacts/patched_registry_64.log

      - name: Remove redundant registry UTF16 path copy and retest
        shell: msys2 {0}
        run: |
          set -euo pipefail
          python tests/patch_glib_registry_owned_path.py glib-src/gio/gwin32registrykey.c
          git -C glib-src diff --check
          meson compile -C glib-build
          git -C glib-src diff -- gio/gwin32registrykey.c > artifacts/registry_utf16_ownership.diff
          export GOBJECT_DEBUG=instance-count
          meson devenv -C glib-build "$PWD/glib-build/gio_appinfo_retained_lifetime.exe" > artifacts/ownedpath_lifetime.log
          meson devenv -C glib-build "$PWD/glib-build/gio_appinfo_api_regression.exe" > artifacts/ownedpath_api.log
          grep -q 'C545D_RETAINED_APPINFO,PASS' artifacts/ownedpath_lifetime.log
          grep -q 'GIO_API_PASS' artifacts/ownedpath_api.log
          meson devenv -C glib-build "$PWD/glib-build/gio_appinfo_probe.exe" --report-types > artifacts/ownedpath_registry.log
          meson devenv -C glib-build "$PWD/glib-build/gio_appinfo_probe.exe" --report-types --cycles=64 > artifacts/ownedpath_registry_64.log
          grep -q 'GIO_PROBE_DONE,cycles=16' artifacts/ownedpath_registry.log
          grep -q 'GIO_PROBE_DONE,cycles=64' artifacts/ownedpath_registry_64.log

      - name: Compare counts with independent pass-fail gates
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out=@()
          foreach($mode in @('baseline_nochange','baseline_registry','patched_nochange','patched_registry','ownedpath_registry')) {
            $lines=@(Get-Content "artifacts/$mode.log")
            $before=@($lines | Where-Object {$_ -match '^GIO_PROBE,baseline,'})
            $after=@($lines | Where-Object {$_ -match '^GIO_PROBE,after_cleanup,'})
            $cycles=@($lines | Where-Object {$_ -match '^GIO_PROBE,cycle,'})
            if ($before.Count -ne 1 -or $after.Count -ne 1 -or $cycles.Count -ne 16) {
              throw "Incomplete cycle data: $mode"
            }
            $b=$before[0].Split(',');$e=$after[0].Split(',')
            $out += [pscustomobject]@{
              mode=$mode
              handles_before=[long]$b[4];handles_after=[long]$e[4]
              handles_delta=[long]$e[4]-[long]$b[4]
              private_before=[long]$b[5];private_after=[long]$e[5]
              private_delta=[long]$e[5]-[long]$b[5]
            }
          }
          $out | Export-Csv -Path artifacts/weak_backref_summary.csv -NoTypeInformation
          $out | Format-Table -AutoSize
          $bc=$out | Where-Object mode -eq baseline_nochange
          $br=$out | Where-Object mode -eq baseline_registry
          $pc=$out | Where-Object mode -eq patched_nochange
          $pr=$out | Where-Object mode -eq patched_registry
          $ur=$out | Where-Object mode -eq ownedpath_registry
          if ($br.handles_delta -lt 300) { throw 'Baseline failure: GLib 2.82.4 registry leak not reproduced' }
          if ([math]::Abs($bc.handles_delta) -gt 4 -or [math]::Abs($pc.handles_delta) -gt 4) { throw 'Control conditions unexpectedly grew' }
          if ($pr.handles_delta -gt 4) { throw "Weak backref candidate failed handle plateau: $($pr.handles_delta)" }
          if ($pr.private_delta -ge $br.private_delta) { throw 'Weak backref did not improve private memory delta' }
          if ([math]::Abs($ur.handles_delta) -gt 4) { throw 'UTF16 ownership patch reintroduced handle growth' }
          $lines64=@(Get-Content artifacts/patched_registry_64.log)
          $base64=@($lines64 | Where-Object {$_ -match '^GIO_PROBE,baseline,'})
          $after64=@($lines64 | Where-Object {$_ -match '^GIO_PROBE,after_cleanup,'})
          $cycles64=@($lines64 | Where-Object {$_ -match '^GIO_PROBE,cycle,'})
          if ($base64.Count -ne 1 -or $after64.Count -ne 1 -or $cycles64.Count -ne 64) {
            throw '64-cycle stress data incomplete'
          }
          $first64=$base64[0].Split(',')
          $final64=$after64[0].Split(',')
          $delta64=[long]$final64[4]-[long]$first64[4]
          $mem64=[long]$final64[5]-[long]$first64[5]
          "PATCHED_64_HANDLE_DELTA=$delta64" | Set-Content artifacts/longer_summary.txt
          "PATCHED_64_PRIVATE_DELTA=$mem64" | Add-Content artifacts/longer_summary.txt
          if ([math]::Abs($delta64) -gt 4) { throw "64-cycle handle leak remains: $delta64" }
          Write-Host (Get-Content artifacts/longer_summary.txt)

          $owned64=@(Get-Content artifacts/ownedpath_registry_64.log)
          $uBefore=@($owned64 | Where-Object {$_ -match '^GIO_PROBE,baseline,'})
          $uAfter=@($owned64 | Where-Object {$_ -match '^GIO_PROBE,after_cleanup,'})
          $uRounds=@($owned64 | Where-Object {$_ -match '^GIO_PROBE,cycle,'})
          if ($uBefore.Count -ne 1 -or $uAfter.Count -ne 1 -or $uRounds.Count -ne 64) {
            throw 'UTF16 owner patch 64-cycle test incomplete'
          }
          $u0=$uBefore[0].Split(',')
          $u1=$uAfter[0].Split(',')
          $uHandle=[long]$u1[4]-[long]$u0[4]
          $uPrivate=[long]$u1[5]-[long]$u0[5]
          $comparison=@(
            [pscustomobject]@{mode='weakref_only';delta_16=$pr.private_delta;delta_64=$mem64;handles_64=$delta64},
            [pscustomobject]@{mode='weakref_plus_utf16';delta_16=$ur.private_delta;delta_64=$uPrivate;handles_64=$uHandle}
          )
          $comparison | Export-Csv -Path artifacts/utf16_memory_comparison.csv -NoTypeInformation
          $comparison | Format-Table -AutoSize
          if ([math]::Abs($uHandle) -gt 4) { throw "UTF16 ownership experiment failed 64-cycle plateau: $uHandle" }
          if ($uPrivate -ge $mem64) {
            throw 'UTF16 fix did not reduce 64-cycle Private Bytes under this workload; investigate'
          }

          $objectSummaries = @()
          foreach ($mode in @('baseline_registry','patched_registry','patched_registry_64','ownedpath_registry','ownedpath_registry_64')) {
            $rows = @(Get-Content "artifacts/$mode.log" | Where-Object { $_ -match '^GIO_TYPE,' })
            if ($rows.Count -lt 14) { throw "GObject instrumentation missing: $mode" }
            $first = @{}
            $last = @{}
            foreach ($row in $rows) {
              $cells = $row.Split(',')
              if ($cells.Count -ne 5) { throw "Malformed GIO_TYPE entry in $mode" }
              if ($cells[1] -eq 'baseline') { $first[$cells[3]] = [int]$cells[4] }
              if ($cells[1] -eq 'after_cleanup') { $last[$cells[3]] = [int]$cells[4] }
            }
            $initialized=@($first.GetEnumerator() | Where-Object { $_.Value -gt 0 })
            if ($initialized.Count -eq 0) { throw "GObject debug instance counting unavailable in $mode" }
            foreach($name in $first.Keys) {
              if (-not $last.ContainsKey($name)) { throw "Missing end count for $name in $mode" }
              $objectSummaries += [pscustomobject]@{
                mode = $mode; type = $name;
                baseline = $first[$name]; after = $last[$name];
                delta = $last[$name] - $first[$name]
              }
            }
          }
          $objectSummaries | Sort-Object mode,type | Export-Csv -Path artifacts/gobject_live_types.csv -NoTypeInformation
          $objectSummaries | Sort-Object mode,type | Format-Table -AutoSize
          'WEAK_BACKREF_EXPERIMENT=GATES_PASSED; NOT_PRODUCTION_RELEASE' | Set-Content artifacts/status.txt
          Get-Content artifacts/status.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c545d-glib-2824-weak-backref-ab
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
