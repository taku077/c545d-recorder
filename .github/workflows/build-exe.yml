name: Windows EXE launcher (stage 1)

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/C545D.Launcher/**'
      - '.github/workflows/build-exe.yml'
      - '*.ps1'
      - '*.vbs'
      - 'README.txt'
      - 'EXE_START_HERE.txt'
  push:
    branches: [main]
    paths:
      - 'src/C545D.Launcher/**'
      - '.github/workflows/build-exe.yml'
      - '*.ps1'
      - '*.vbs'
      - 'README.txt'
      - 'EXE_START_HERE.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Find Visual Studio MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
      - name: Build x64 .NET Framework 4.8 WinExe
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild 'src/C545D.Launcher/C545D.Launcher.csproj' /t:Rebuild /p:Configuration=Release /p:Platform=x64 /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "MSBuild exited $LASTEXITCODE" }
          if (-not (Test-Path 'src/C545D.Launcher/bin/Release/C545D_Recorder.exe')) { throw 'EXE was not produced' }
      - name: Package complete app with unchanged existing scripts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = 'dist/C545D_Recorder'
          New-Item -ItemType Directory -Path $bundle -Force | Out-Null
          $required = @('C545D_App.ps1','Record.ps1','RecordGUIWorker.ps1','SegmentNamer.ps1','SegmentNamerWorker.ps1','CommonSettings.ps1','RecoverPending.ps1','C545D_Start.vbs','README.txt')
          foreach ($item in $required) {
            if (-not (Test-Path -LiteralPath $item -PathType Leaf)) { throw "Missing $item" }
            Copy-Item -LiteralPath $item -Destination $bundle -Force
          }
          Copy-Item 'src/C545D.Launcher/bin/Release/C545D_Recorder.exe' -Destination $bundle
          Copy-Item 'EXE_START_HERE.txt' -Destination $bundle
          Compress-Archive -Path "$bundle/*" -DestinationPath 'dist/C545D_Recorder_EXE_Win10_x64.zip' -Force
          Write-Host 'ZIP generated with the 9 original baseline sources and launcher EXE.'
      - name: Smoke-test EXE launch and avdec setting (no camera)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Keep the production bundle unchanged. Run a harmless temporary
          # replacement for C545D_App.ps1 to verify Windows PowerShell startup,
          # spaces/Japanese characters in folder paths, and decoder preference.
          $smokeDir = Join-Path $env:RUNNER_TEMP 'C545D smoke 日本語'
          New-Item -ItemType Directory -Path $smokeDir -Force | Out-Null
          Copy-Item 'dist/C545D_Recorder/*' -Destination $smokeDir -Force
          $env:C545D_LAUNCH_SMOKE_OUTPUT = Join-Path $env:RUNNER_TEMP 'C545D_LAUNCH_SMOKE_PASS.txt'
          Remove-Item $env:C545D_LAUNCH_SMOKE_OUTPUT -Force -ErrorAction SilentlyContinue
          $stub = @'
          if ($env:C545D_VIDEO_DECODER -ne 'avdec') { exit 19 }
          [System.IO.File]::WriteAllText($env:C545D_LAUNCH_SMOKE_OUTPUT, 'PASS')
          '@
          [IO.File]::WriteAllText((Join-Path $smokeDir 'C545D_App.ps1'), $stub, [Text.UTF8Encoding]::new($false))
          $launcher = Join-Path $smokeDir 'C545D_Recorder.exe'
          $process = Start-Process -FilePath $launcher -WorkingDirectory $smokeDir -PassThru
          if (-not $process.WaitForExit(15000)) { try { $process.Kill() } catch {} ; throw 'Launcher did not exit' }
          if ($process.ExitCode -ne 0) { throw "Launcher exit code: $($process.ExitCode)" }
          $found = $false
          for ($i = 0; $i -lt 50; $i++) {
            if (Test-Path -LiteralPath $env:C545D_LAUNCH_SMOKE_OUTPUT) { $found = $true; break }
            Start-Sleep -Milliseconds 200
          }
          if (-not $found) { throw 'Launcher did not start PowerShell with the expected decoder preference' }
          if ((Get-Content -LiteralPath $env:C545D_LAUNCH_SMOKE_OUTPUT -Raw).Trim() -ne 'PASS') { throw 'Unexpected smoke-test result' }
          Write-Host 'PASS: x64 EXE launched the existing Windows PowerShell 5.1 UI entrypoint (synthetic test).'
      - name: Reject sensitive files in packaged ZIP
        shell: powershell
        run: |
          $names = @(Get-ChildItem 'dist/C545D_Recorder' -File | ForEach-Object Name)
          $forbidden = @($names | Where-Object { $_ -match '(?i)(settings\.json|camera_password\.dpapi|\.etl$|\.mp4$|\.mkv$|\.csv$|Recording_.*\.txt$)' })
          if ($forbidden.Count -gt 0) { throw "Unexpected private data in the ZIP: $($forbidden -join ', ')" }
      - uses: actions/upload-artifact@v4
        with:
          name: c545d-exe-win10-x64
          path: dist/C545D_Recorder_EXE_Win10_x64.zip
          retention-days: 7
          if-no-files-found: error
