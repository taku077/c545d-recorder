name: Windows native EXE controller (stage 2)

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/C545D.Launcher/**'
      - '.github/workflows/build-exe.yml'
      - '*.ps1'
      - '*.vbs'
      - '*.cmd'
      - 'native/sei_filter/**'
      - 'README.txt'
      - 'EXE_START_HERE.txt'
  push:
    branches: [main]
    paths:
      - 'src/C545D.Launcher/**'
      - '.github/workflows/build-exe.yml'
      - '*.ps1'
      - '*.vbs'
      - '*.cmd'
      - 'README.txt'
      - 'EXE_START_HERE.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Find Visual Studio MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
      - name: Configure MSVC C compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install official GStreamer 1.28.8 SDK on build agent (not user PC)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $url='https://gstreamer.freedesktop.org/data/pkg/windows/1.28.8/msvc/gstreamer-1.0-msvc-x86_64-1.28.8.exe'
          $installer=Join-Path $env:RUNNER_TEMP 'gstreamer-sdk.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer -TimeoutSec 180 -MaximumRedirection 5
          if ((Get-Item $installer).Length -lt 15000000) { throw 'Invalid SDK download' }
          $root=Join-Path $env:RUNNER_TEMP 'gst-1.28.8'
          $args=@('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/TYPE=devel',"/DIR=$root")
          $p=Start-Process -FilePath $installer -ArgumentList $args -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "GStreamer installer failed $($p.ExitCode)" }
          if (-not (Test-Path "$root\lib\gstbase-1.0.lib")) { throw 'SDK headers/libs not available' }
      - name: Build and smoke-test private H264 SEI filter plugin
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'gst-1.28.8'
          $inc=@("/I$root\include\gstreamer-1.0","/I$root\include\glib-2.0","/I$root\lib\glib-2.0\include")
          $out=Join-Path $env:RUNNER_TEMP 'c545d-plugins'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          cl.exe /nologo /W4 /MD /O2 /TC /Fe:"$env:RUNNER_TEMP\test_au_classifier.exe" native/sei_filter/test_au_classifier.c
          if ($LASTEXITCODE -ne 0) { throw 'H264 AU classifier build failed' }
          & "$env:RUNNER_TEMP\test_au_classifier.exe"
          if ($LASTEXITCODE -ne 0) { throw 'H264 AU classifier tests failed' }
          & cl.exe @(@('/nologo','/W4','/MD','/O2','/LD','/TC')+$inc+@('native/sei_filter/gstc545dsei.c',"/Fe:$out\gstc545dsei.dll",'/link',"/LIBPATH:$root\lib",'gstreamer-1.0.lib','gstbase-1.0.lib','gobject-2.0.lib','glib-2.0.lib'))
          if ($LASTEXITCODE -ne 0) { throw 'GStreamer SEI filter build failed' }
          $env:PATH="$root\bin;$env:PATH"
          $env:GST_PLUGIN_PATH_1_0=$out
          & "$root\bin\gst-inspect-1.0.exe" c545dseifilter | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'GStreamer filter registration failed' }
          & cl.exe @(@('/nologo','/W4','/MD','/O2','/TC')+$inc+@('native/sei_filter/test_plugin_roundtrip.c',"/Fe:$env:RUNNER_TEMP\test_sei_plugin.exe",'/link',"/LIBPATH:$root\lib",'gstreamer-1.0.lib','gstapp-1.0.lib','gobject-2.0.lib','glib-2.0.lib'))
          if ($LASTEXITCODE -ne 0) { throw 'Filter end-to-end test compile failed' }
          & "$env:RUNNER_TEMP\test_sei_plugin.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Filter SEI/picture end-to-end test failed' }
      - name: REQUIRED gate - parse entire production RTSP/compositor/x264/AAC/MP4 graph using GStreamer (no camera)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'gst-1.28.8'
          $inc=@("/I$root\include\gstreamer-1.0","/I$root\include\glib-2.0","/I$root\lib\glib-2.0\include")
          $parser=Join-Path $env:RUNNER_TEMP 'parse_complete_graph.exe'
          & cl.exe @(@('/nologo','/W4','/MD','/O2','/TC')+$inc+@('native/sei_filter/test_full_pipeline_parse.c',"/Fe:$parser",'/link',"/LIBPATH:$root\lib",'gstreamer-1.0.lib','gobject-2.0.lib','glib-2.0.lib'))
          if ($LASTEXITCODE -ne 0) { throw 'Full graph GStreamer parser build failed' }
          $env:PATH="$root\bin;$env:PATH"
          $env:GST_PLUGIN_PATH_1_0=Join-Path $env:RUNNER_TEMP 'c545d-plugins'
          $env:GST_REGISTRY=Join-Path $env:RUNNER_TEMP 'gst-recorder-full-graph-ci.bin'
          $index=0
          foreach($sei in @(0,1)) {
            foreach($h264 in @(0,1)) {
              foreach($audio in @(0,1)) {
                foreach($dts in @(0,1)) {
                  $index++
                  $tokens=Join-Path $env:RUNNER_TEMP "C545D_full_graph_$index.txt"
                  & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'tests/Export-RecorderGraphForCI.ps1' -OutputPath $tokens -SeiFilter $sei -H264InputGuard $h264 -AudioTsGuard $audio -DtsGuard $dts
                  if ($LASTEXITCODE -ne 0) { throw "Production graph extraction failed, variant $index" }
                  & $parser $tokens
                  if ($LASTEXITCODE -ne 0) {
                    throw "GStreamer rejected ACTUAL production graph. Variant=$index sei=$sei h264=$h264 audio=$audio dts=$dts. DO NOT RELEASE."
                  }
                }
              }
            }
          }
          if ($index -ne 16) { throw 'Full graph matrix incomplete' }
          Write-Host 'PASS: GStreamer parsed all 16 exact PowerShell-built production graph variants'
      - name: Build x64 .NET Framework 4.8 WinExe
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild 'src/C545D.Launcher/C545D.Launcher.csproj' /t:Rebuild /p:Configuration=Release /p:Platform=x64 /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "MSBuild exited $LASTEXITCODE" }
          if (-not (Test-Path 'src/C545D.Launcher/bin/Release/C545D_Recorder.exe')) { throw 'EXE was not produced' }
      - name: Package complete native app and unchanged recording backend
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = 'dist/C545D_Recorder'
          New-Item -ItemType Directory -Path $bundle -Force | Out-Null
          $required = @('C545D_SettingsBridge.ps1','C545D_App.ps1','Record.ps1','RecordGUIWorker.ps1','SegmentNamer.ps1','SegmentNamerWorker.ps1','CommonSettings.ps1','RecoverPending.ps1','C545D_Start.vbs','START_DIAGNOSTIC.cmd','EXPORT_SAFE_LOGS.cmd','Export-SafeDiagnostics.ps1','START_SEI_FILTER_DIAGNOSTIC.cmd','README.txt')
          foreach ($item in $required) {
            if (-not (Test-Path -LiteralPath $item -PathType Leaf)) { throw "Missing $item" }
            Copy-Item -LiteralPath $item -Destination $bundle -Force
          }
          $privatePlugins=Join-Path $bundle 'plugins'
          New-Item -ItemType Directory -Force -Path $privatePlugins | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP 'c545d-plugins\gstc545dsei.dll') -Destination $privatePlugins -Force
          Copy-Item 'src/C545D.Launcher/bin/Release/C545D_Recorder.exe' -Destination $bundle
          Copy-Item 'EXE_START_HERE.txt' -Destination $bundle
          Compress-Archive -Path "$bundle/*" -DestinationPath 'dist/C545D_Recorder_EXE_Win10_x64.zip' -Force
          Write-Host 'ZIP generated with native C# WinForms and unchanged recording worker sources.'
      - name: Guard private hidden console and safe EOS stop semantics
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $ui = [IO.File]::ReadAllText('src/C545D.Launcher/RecorderForm.cs')
          $entry = [IO.File]::ReadAllText('src/C545D.Launcher/Program.cs')
          if ($ui -notmatch 'UseShellExecute = withConsole') { throw 'Native worker console hidden-window strategy missing' }
          if ($ui -notmatch 'WindowStyle = ProcessWindowStyle.Hidden') { throw 'Native child console no longer hidden' }
          if ($entry -notmatch 'SetEnvironmentVariable\("C545D_VIDEO_DECODER", "avdec"\)') { throw 'Decoder setting must be inherited by hidden worker' }
          if ($ui -notmatch 'GenerateConsoleCtrlEvent\(0, 0\)') { throw 'Ctrl+C EOS stop unavailable' }
          if ($ui -notmatch 'File.WriteAllText\(stopFile') { throw 'Durable stop marker unavailable' }
          Write-Host 'PASS: hidden worker console and EOS invariants'
      - name: Check opt-in diagnostic launcher (no camera)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diag = [IO.File]::ReadAllText('dist/C545D_Recorder/START_DIAGNOSTIC.cmd')
          if ($diag -notmatch 'GST_DEBUG_FILE=') { throw 'Diagnostic log output path absent' }
          if ($diag -notmatch 'GST_DIAG_%%p_%%r\.log') { throw 'Per-process GStreamer log isolation absent' }
          if ($diag -notmatch 'GST_DEBUG_NO_COLOR=1') { throw 'Debug color disable absent' }
          if ($diag -notmatch 'qtmux:5' -or $diag -notmatch 'h264parse:5') { throw 'Mux/parser focused debug categories absent' }
          if ($diag -match '(?i)taskkill|gst-fatal-warnings|[^\w]del[ /]|[^\w]erase[ /]') {
            throw 'Diagnostics launcher must not kill recording or delete files'
          }
          Write-Host 'PASS: opt-in diagnostics shipped with per-process log isolation'
      - name: Verify safe diagnostic ZIP export with synthetic credentials (no camera)
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src=Join-Path $env:RUNNER_TEMP 'fake C545D logs'
          $dst=Join-Path $env:RUNNER_TEMP 'safe C545D downloads'
          New-Item -ItemType Directory -Force -Path $src,$dst | Out-Null
          $raw=@'
          0:00:40.570391500 12596 10556 ERROR libav :0:: no frame!
          0:00:40.325344600 12596 12484 ERROR qtmux gstqtmux.c:5627: decreasing DTS value 0:00:37.225127817 < 0:00:37.235009266
          0:00:42.1 12596 DEBUG rtph264depay user-pw=SUPER_TEST_SECRET_923 rtsp://camerauser:SUPER_TEST_SECRET_923@192.0.2.123:554/stream1
          0:00:43.1 12596 WARN rtpjitterbuffer authorization Basic c3VwZXJzZWNyZXQ=
          '@
          $fakeLog = Join-Path $src 'GST_DIAG_123_456.log'
          [IO.File]::WriteAllText($fakeLog,$raw)
          # Old exporter silently dropped error events after its 18000-row cap.
          # Saturate it with routine debug before appending essential errors.
          $writer=[IO.StreamWriter]::new($fakeLog,$true)
          try {
            for ($i=0; $i -lt 20000; $i++) {
              $writer.WriteLine('0:00:45.000000000 12596 10556 DEBUG rtph264depay synthetic sample')
            }
            $writer.WriteLine('0:00:50.000000000 12596 10556 ERROR libav :0:: no frame!')
            $writer.WriteLine('0:00:51.000000000 12596 12484 ERROR qtmux decreasing DTS value 0:00:46.111111111 < 0:00:46.222222222')
            $writer.WriteLine('0:00:52.000000000 12596 ERROR: erroneous pipeline: syntax error user-pw=SUPER_TEST_SECRET_923')
            $writer.WriteLine('GStreamer returned; exitCode=1; stopMarker=False')
          } finally { $writer.Dispose() }
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'Export-SafeDiagnostics.ps1' -LogsDirectory $src -OutputDirectory $dst
          if ($LASTEXITCODE -ne 0) { throw "Safe export returned $LASTEXITCODE" }
          $zip=Get-ChildItem -LiteralPath $dst -Filter 'C545D_SAFE_DIAGNOSTICS_*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'Sanitized ZIP not produced' }
          $unpack=Join-Path $env:RUNNER_TEMP 'safe C545D unpacked'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $unpack -Force
          $events=[IO.File]::ReadAllText((Join-Path $unpack 'media_events.tsv'))
          $summary=[IO.File]::ReadAllText((Join-Path $unpack 'summary.txt'))
          $rates=[IO.File]::ReadAllText((Join-Path $unpack 'event_rates.tsv'))
          if ($summary -notmatch 'GST_PIPELINE_ERROR=1' -or $summary -notmatch 'GST_EXIT=1') {
            throw 'Fatal gst-launch pipeline parse errors or exit status missing from safe export'
          }
          if ($events -notmatch 'exit_code=1') { throw 'Nonzero exit code not safely exported' }
          if ($summary -notmatch 'LIBAV_NO_FRAME=2' -or $summary -notmatch 'QTMUX_DTS_BACKWARD=2') {
            throw 'Error counts did not cover the full log after 20000 debug lines'
          }
          if ($summary -notmatch 'Scan status: COMPLETE') { throw 'Log scan was silently truncated' }
          if ($rates -notmatch 'QTMUX_DTS_BACKWARD' -or $rates -notmatch 'LIBAV_NO_FRAME') {
            throw 'Per-second event-rate data missing'
          }
          if ($events -notmatch 'LIBAV_NO_FRAME' -or $events -notmatch 'QTMUX_DTS_BACKWARD') {
            throw 'Essential sanitized diagnostic events were lost'
          }
          $combined=$events+$summary+$rates
          foreach ($secret in @('SUPER_TEST_SECRET_923','camerauser','192.0.2.123','c3VwZXJzZWNyZXQ=','user-pw','authorization')) {
            if ($combined -match [regex]::Escape($secret)) { throw "Secret leaked in safe export" }
          }
          if ($combined -match 'rtsp://|[A-Z]:\\') { throw 'Raw path/URI leaked in safe export' }
          Write-Host 'PASS: schema-only safe ZIP retains media error evidence and excludes credentials'
      - name: Guard optional SEI filter path and rollback semantics
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if (-not (Test-Path 'dist/C545D_Recorder/plugins/gstc545dsei.dll')) { throw 'Candidate DLL missing' }
          $rec=[IO.File]::ReadAllText('Record.ps1')
          if ($rec -notmatch "C545D_SEI_AU_FILTER") { throw 'No explicit opt-in switch' }
          if ($rec -notmatch 'if \(\$script:useSeiAuFilter\)') { throw 'AU guard not conditional' }
          $test=[IO.File]::ReadAllText('dist/C545D_Recorder/START_SEI_FILTER_DIAGNOSTIC.cmd')
          if ($test -notmatch 'C545D_SEI_AU_FILTER=on') { throw 'Trial launcher missing' }
          Write-Host 'PASS: GStreamer filter stays conditional with EXE-controlled ON/OFF, and trial CMD remains compatible'
      - name: Smoke-test native WinForms startup (no camera)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $smokeDir = Join-Path $env:RUNNER_TEMP 'C545D smoke 日本語'
          New-Item -ItemType Directory -Path $smokeDir -Force | Out-Null
          Copy-Item 'dist/C545D_Recorder/*' -Destination $smokeDir -Force
          $env:C545D_NATIVE_SMOKE_OUTPUT = Join-Path $env:RUNNER_TEMP 'C545D_NATIVE_PASS.txt'
          Remove-Item $env:C545D_NATIVE_SMOKE_OUTPUT -Force -ErrorAction SilentlyContinue
          $launcher = Join-Path $smokeDir 'C545D_Recorder.exe'
          $process = Start-Process -FilePath $launcher -ArgumentList '--smoke' -WorkingDirectory $smokeDir -PassThru
          if (-not $process.WaitForExit(15000)) {
            try { $process.Kill() } catch {}
            throw 'Native WinForms startup did not exit during synthetic smoke'
          }
          if ($process.ExitCode -ne 0) { throw "Native EXE exit code: $($process.ExitCode)" }
          if (-not (Test-Path $env:C545D_NATIVE_SMOKE_OUTPUT)) { throw 'Native WinForms did not initialize' }
          if ((Get-Content $env:C545D_NATIVE_SMOKE_OUTPUT -Raw).Trim() -ne 'PASS NATIVE WINFORMS;SEI=on') {
            throw 'Direct EXE must default SEI filter ON'
          }
          # Explicit opt-out must remain available without extra CMD launchers.
          $env:C545D_SEI_AU_FILTER = 'off'
          Remove-Item $env:C545D_NATIVE_SMOKE_OUTPUT -Force
          $fallback = Start-Process -FilePath $launcher -ArgumentList '--smoke' -WorkingDirectory $smokeDir -PassThru
          if (-not $fallback.WaitForExit(15000)) {
            try { $fallback.Kill() } catch {}
            throw 'Native SEI OFF fallback smoke timed out'
          }
          if ($fallback.ExitCode -ne 0 -or
              (Get-Content $env:C545D_NATIVE_SMOKE_OUTPUT -Raw).Trim() -ne 'PASS NATIVE WINFORMS;SEI=off') {
            throw 'Native fallback must preserve SEI OFF'
          }
          Remove-Item Env:C545D_SEI_AU_FILTER -ErrorAction SilentlyContinue
          $ui=[IO.File]::ReadAllText('src/C545D.Launcher/RecorderForm.cs')
          if ($ui -notmatch 'Log\("SEI-only AU filter requested=" \+ seiMode') { throw 'SEI choice not logged' }
          if ($ui -notmatch 'ApplySeiFilterChoice\(\);[\s\S]*?StartScript\("RecordGUIWorker.ps1"') {
            throw 'SEI environment choice must be applied before launching recorder worker'
          }
          if (-not (Test-Path 'dist/C545D_Recorder/plugins/gstc545dsei.dll')) {
            throw 'Native default ON requires bundled SEI plugin DLL'
          }
          Write-Host 'PASS: Direct EXE defaults SEI ON; OFF fallback works, ZIP includes DLL (no camera)'
      - name: Check DPAPI settings bridge round trip with synthetic data
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $oldAppData = $env:LOCALAPPDATA
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'C545D synthetic settings'
          $folder = Join-Path $env:RUNNER_TEMP 'C545D temporary output'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          $source = Join-Path $env:GITHUB_WORKSPACE 'C545D_SettingsBridge.ps1'
          $payload = @{camera_ip='192.0.2.10';camera_user='synthetic';output_folder=$folder;new_password='synthetic-only'} | ConvertTo-Json -Compress
          try {
            $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($payload))
            $encoded | & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $source | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Bridge initial save failed' }
            . (Join-Path $env:GITHUB_WORKSPACE 'CommonSettings.ps1')
            $s = Read-C545DSettings
            if ($s.camera_user -ne 'synthetic') { throw 'Saved settings invalid' }
            $sec = Read-C545DPassword
            $ptr = [Runtime.InteropServices.Marshal]::SecureStringToBSTR($sec)
            try {
              if ([Runtime.InteropServices.Marshal]::PtrToStringBSTR($ptr) -ne 'synthetic-only') {
                throw 'DPAPI secret round-trip failed'
              }
            } finally {
              [Runtime.InteropServices.Marshal]::ZeroFreeBSTR($ptr)
              $sec.Dispose()
            }
            $payload2 = @{camera_ip='192.0.2.10';camera_user='synthetic';output_folder=$folder;new_password=''} | ConvertTo-Json -Compress
            $encoded2 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($payload2))
            $encoded2 | & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $source | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Empty password preservation failed' }
            Write-Host 'PASS: synthetic settings and DPAPI existing-user compatibility'
          } finally {
            $env:LOCALAPPDATA = $oldAppData
          }
      - name: Reject sensitive files in packaged ZIP
        shell: powershell
        run: |
          $names = @(Get-ChildItem 'dist/C545D_Recorder' -File | ForEach-Object Name)
          $forbidden = @($names | Where-Object { $_ -match '(?i)(settings\.json|camera_password\.dpapi|\.etl$|\.mp4$|\.mkv$|\.csv$|Recording_.*\.txt$)' })
          if ($forbidden.Count -gt 0) { throw "Unexpected private data in the ZIP: $($forbidden -join ', ')" }
      - uses: actions/upload-artifact@v4
        with:
          name: c545d-exe-win10-x64
          path: dist/C545D_Recorder_EXE_Win10_x64.zip
          retention-days: 7
          if-no-files-found: error
      - name: Publish prerelease with direct ZIP download (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "c545d-stage2-rc-$env:GITHUB_RUN_NUMBER"
          gh release create $tag 'dist/C545D_Recorder_EXE_Win10_x64.zip' --title "C545D Stage 2 Native WinForms RC $env:GITHUB_RUN_NUMBER" --notes "Native C# WinForms controller. Recording backend remains PowerShell/GStreamer. Camera stop/EOS, A/V sync and long-run memory improvement are not yet verified on real hardware. Keep the older working app for rollback." --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publish failed' }
          Write-Host "Direct downloadable release created: $tag"
