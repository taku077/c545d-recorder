name: C545D final residual 256-cycle causal boundary (CI only)

on:
  push:
    branches: ['investigate/c545d-last-residual-slope-20261120']
    paths:
      - 'tests/analyze_gio_final_residual_boundary.py'
      - '.github/workflows/c545d-final-residual-boundary-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  residual-boundary:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-pcre2
            mingw-w64-x86_64-libffi
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-gettext
            mingw-w64-x86_64-python

      - name: Compile exact GLib 2.82.4 weakref/UTF16 and WinRT DisplayName cache
        shell: msys2 {0}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 2.82.4 https://github.com/GNOME/glib.git glib-src
          python tests/patch_glib_appinfo_weak_backrefs.py glib-src/gio/gwin32appinfo.c
          python tests/patch_glib_registry_owned_path.py glib-src/gio/gwin32registrykey.c
          python tests/patch_glib_uwp_api_isolation.py glib-src/gio/gwin32appinfo.c glib-src/gio/gwin32packageparser.c
          python tests/patch_glib_uwp_displayname_cache_diagnostic.py glib-src/gio/gwin32packageparser.c
          git -C glib-src diff --check
          meson setup glib-build glib-src -Dglib_debug=enabled -Dtests=false -Dintrospection=disabled -Ddocumentation=false -Dman-pages=disabled -Ddefault_library=shared
          meson compile -C glib-build
          meson devenv -C glib-build sh -c 'gcc -O2 -Wall -Wextra -o gio_appinfo_probe.exe ../tests/gio_appinfo_key_handle_probe.c $(pkg-config --cflags --libs gio-2.0) -lpsapi -ladvapi32'
          mkdir -p artifacts
          echo 'DIAGNOSTIC ONLY; source modes alter user-visible AppInfo semantics; NOT A DEPLOYABLE RECORDER CONFIGURATION' > artifacts/NOT_FOR_PRODUCTION.txt

      - name: Paired 256-cycle normal cached vs getter-omission vs UWP-enumeration omission
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export GOBJECT_DEBUG=instance-count
          unset C545D_HANDLE_EXE C545D_DIAG_UWP_SKIP_CURRENT C545D_DIAG_UWP_NO_DISPLAYNAME_GETTER C545D_DIAG_UWP_CACHE_DISPLAYNAME || true
          for stage in cached_original no_displayname_getter skip_uwp_current; do
            unset C545D_DIAG_UWP_SKIP_CURRENT C545D_DIAG_UWP_NO_DISPLAYNAME_GETTER C545D_DIAG_UWP_CACHE_DISPLAYNAME || true
            case "$stage" in
              cached_original) export C545D_DIAG_UWP_CACHE_DISPLAYNAME=1 ;;
              no_displayname_getter) export C545D_DIAG_UWP_NO_DISPLAYNAME_GETTER=1 ;;
              skip_uwp_current) export C545D_DIAG_UWP_SKIP_CURRENT=1 ;;
            esac
            for scope in nochange registry; do
              args=(--cycles=256 --heap-summary --vm-summary --report-types)
              if [ "$scope" = nochange ]; then args+=(--no-registry-change); fi
              echo "C545D_FINAL_RESIDUAL_START,stage=$stage,scope=$scope"
              meson devenv -C glib-build "$PWD/glib-build/gio_appinfo_probe.exe" "${args[@]}" > "artifacts/${stage}_${scope}_256.log"
              grep -q 'GIO_PROBE_DONE,cycles=256' "artifacts/${stage}_${scope}_256.log"
              echo "C545D_FINAL_RESIDUAL_COMPLETE,stage=$stage,scope=$scope"
            done
          done

      - name: Compare last 128 cycles, per-64 trends, handles and cache misses
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          py tests/analyze_gio_final_residual_boundary.py | Tee-Object -FilePath artifacts/final_residual_analysis.txt
          if ($LASTEXITCODE -ne 0) { throw 'Missing 256-cycle causal evidence or resource regression' }
          Get-Content artifacts/final_residual_boundary.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c545d-final-residual-causal-diagnostic
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
