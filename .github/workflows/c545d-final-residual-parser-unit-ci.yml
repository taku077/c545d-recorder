name: C545D final-residual analysis synthetic-only unit tests

on:
  push:
    branches: ['investigate/c545d-last-residual-slope-20261120']
    paths:
      - 'tests/test_analyze_gio_final_residual_boundary.py'
      - '.github/workflows/c545d-final-residual-parser-unit-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate 256-cycle comparison, missing data, handles and cache misses
        run: python -m unittest -v tests/test_analyze_gio_final_residual_boundary.py
